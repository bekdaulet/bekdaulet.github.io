акалавры (1953) мен физика магистрі (1954), кейін Кембриджде Абдус Саламның жетекшілігімен физика бойынша докторлық (1957). 1959 жылдан Гарвардта физика ассистент-профессоры.", "ru": "Бакалавр по химии и физике (1953) и магистр физики (1954) в Гарварде, затем докторская по физике в Кембридже (1957) у Абдуса Салама. С 1959 года ассистент-профессор физики в Гарварде."}, "helped": {"en": "His wife worked for James Watson, who drew him into molecular biology; the two ran a joint laboratory through the 1960s. A theorist's taste for clean, general methods produced the Maxam-Gilbert chemical method for reading DNA sequences. He later co-founded Biogen.", "kk": "Әйелі Джеймс Уотсонның қасында жұмыс істеді, ол Гилбертті молекулалық биологияға тартты; 1960 жылдары екеуі ортақ зертхана басқарды. Теоретиктің таза, жалпы әдістерге бейімділігі ДНҚ реттілігін оқудың Максам — Гилберт химиялық әдісін туғызды. Кейін Biogen компаниясының негізін қалаушылардың бірі болды.", "ru": "Его жена работала у Джеймса Уотсона, который увлёк его молекулярной биологией; в 1960-е они вели общую лабораторию. Вкус теоретика к чистым, общим методам породил химический метод Максама — Гилберта для чтения последовательностей ДНК. Позже он стал сооснователем компании Biogen."}}}, {"n": 23, "options": [{"name": {"en": "Karl Landsteiner", "kk": "Карл Ландштейнер", "ru": "Карл Ландштейнер"}, "cat": "Medicine", "year": 1930, "topic": {"en": "discovery of human blood groups", "kk": "адам қан топтарының ашылуы", "ru": "открытие групп крови человека"}}, {"name": {"en": "Toni Morrison", "kk": "Тони Моррисон", "ru": "Тони Моррисон"}, "cat": "Literature", "year": 1993, "topic": {"en": "novels of visionary force; 'Beloved'", "kk": "көріпкелдік күшке толы романдар; «Сүйікті»", "ru": "романы визионерской силы; «Возлюбленная»"}}, {"name": {"en": "Andrei Sakharov", "kk": "Андрей Сахаров", "ru": "Андрей Сахаров"}, "cat": "Peace", "year": 1975, "topic": {"en": "struggle for human rights and against the nuclear arms race", "kk": "адам құқықтары үшін және ядролық қарулану жарысына қарсы күрес", "ru": "борьба за права человека и против гонки ядерных вооружений"}}], "answer": 2, "physicist": {"name": {"en": "Andrei Sakharov", "kk": "Андрей Сахаров", "ru": "Андрей Сахаров"}, "cat": "Peace", "year": 1975, "topic": {"en": "struggle for human rights and against the nuclear arms race", "kk": "адам құқықтары үшін және ядролық қарулану жарысына қарсы күрес", "ru": "борьба за права человека и против гонки ядерных вооружений"}, "bg": {"en": "Joined Igor Tamm's theory department at the Lebedev Physical Institute in 1945 and defended his thesis there in 1947. Father of the Soviet hydrogen bomb, co-inventor of the tokamak concept, author of the Sakharov conditions for the matter-antimatter asymmetry of the universe (1967).", "kk": "1945 жылы ФИАН-дағы Игорь Таммның теориялық бөліміне келіп, 1947 жылы сонда диссертация қорғады. Кеңес сутегі бомбасының атасы, токамак идеясының авторларының бірі, Әлемдегі материя мен антиматерия асимметриясының Сахаров шарттарының авторы (1967).", "ru": "В 1945 году пришёл в теоретический отдел Игоря Тамма в ФИАНе и в 1947 году защитил там диссертацию. Отец советской водородной бомбы, соавтор идеи токамака, автор условий Сахарова для асимметрии материи и антиматерии во Вселенной (1967)."}, "helped": {"en": "Alarmed by the harm done by radioactive fallout, he pushed to end atmospheric testing and played a role in the 1963 Partial Test Ban Treaty. The same insistence on facing facts made him the USSR's leading dissident, exiled to Gorky in 1980-86.", "kk": "Радиоактивті түсудің зиянына алаңдап, ол атмосферадағы сынақтарды тоқтатуды талап етті және 1963 жылғы Ядролық сынақтарға ішінара тыйым салу шартына үлес қосты. Фактілерге тура қарау әдеті оны КСРО-ның басты диссидентіне айналдырды, 1980–86 жылдары Горькийге жер аударылды.", "ru": "Встревоженный вредом радиоактивных осадков, он добивался прекращения атмосферных испытаний и сыграл роль в Договоре 1963 года о запрещении ядерных испытаний в трёх средах. Та же привычка смотреть фактам в лицо сделала его главным диссидентом СССР, сосланным в Горький в 1980–86 годах."}}}, {"n": 24, "options": [{"name": {"en": "Richard Henderson", "kk": "Ричард Хендерсон", "ru": "Ричард Хендерсон"}, "cat": "Chemistry", "year": 2017, "topic": {"en": "cryo-electron microscopy for high-resolution structures of biomolecules", "kk": "биомолекулалардың жоғары ажыратымдылықтағы құрылымына арналған криоэлектронды микроскопия", "ru": "криоэлектронная микроскопия для структур биомолекул высокого разрешения"}}, {"name": {"en": "Paul Samuelson", "kk": "Пол Самуэльсон", "ru": "Пол Самуэльсон"}, "cat": "Economics", "year": 1970, "topic": {"en": "raising the level of scientific analysis in economics", "kk": "экономикадағы ғылыми талдау деңгейін көтеру", "ru": "повышение уровня научного анализа в экономике"}}, {"name": {"en": "Milton Friedman", "kk": "Милтон Фридман", "ru": "Милтон Фридман"}, "cat": "Economics", "year": 1976, "topic": {"en": "consumption analysis, monetary history and theory", "kk": "тұтынуды талдау, ақша тарихы мен теориясы", "ru": "анализ потребления, история и теория денег"}}], "answer": 0, "physicist": {"name": {"en": "Richard Henderson", "kk": "Ричард Хендерсон", "ru": "Ричард Хендерсон"}, "cat": "Chemistry", "year": 2017, "topic": {"en": "cryo-electron microscopy for high-resolution structures of biomolecules", "kk": "биомолекулалардың жоғары ажыратымдылықтағы құрылымына арналған криоэлектронды микроскопия", "ru": "криоэлектронная микроскопия для структур биомолекул высокого разрешения"}, "bg": {"en": "BSc in physics at Edinburgh (1966) before moving to the MRC Laboratory of Molecular Biology in Cambridge, where he later became director.", "kk": "Эдинбургте физика бакалавры (1966), кейін Кембридждегі MRC Молекулалық биология зертханасына ауысып, кейінірек оның директоры болды.", "ru": "Бакалавр физики в Эдинбурге (1966), затем перешёл в Лабораторию молекулярной биологии MRC в Кембридже, которую позже возглавил."}, "helped": {"en": "He produced the first atomic-resolution structure of a membrane protein (bacteriorhodopsin, 1990) by electron crystallography. Understanding electron scattering, radiation damage and detector physics, he championed direct electron detectors, which triggered the 'resolution revolution' in structural biology.", "kk": "Электронды кристаллография әдісімен ол мембраналық ақуыздың алғашқы атомдық ажыратымдылықтағы құрылымын алды (бактериородопсин, 1990). Электрондардың шашырауын, радиациялық зақымды және детектор физикасын түсіне отырып, ол тікелей электрон детекторларын қолдады, бұл құрылымдық биологиядағы «ажыратымдылық революциясын» тудырды.", "ru": "Методом электронной кристаллографии он получил первую структуру мембранного белка с атомным разрешением (бактериородопсин, 1990). Понимая рассеяние электронов, радиационные повреждения и физику детекторов, он продвигал прямые детекторы электронов, которые вызвали «революцию разрешения» в структурной биологии."}}}, {"n": 25, "options": [{"name": {"en": "Kary Mullis", "kk": "Кэри Муллис", "ru": "Кэри Муллис"}, "cat": "Chemistry", "year": 1993, "topic": {"en": "polymerase chain reaction (PCR)", "kk": "полимеразды тізбекті реакция (ПТР)", "ru": "полимеразная цепная реакция (ПЦР)"}}, {"name": {"en": "Kazuo Ishiguro", "kk": "Кадзуо Исигуро", "ru": "Кадзуо Исигуро"}, "cat": "Literature", "year": 2017, "topic": {"en": "'The Remains of the Day'", "kk": "«Күннің қалдығы»", "ru": "«Остаток дня»"}}, {"name": {"en": "Robert Engle", "kk": "Роберт Энгл", "ru": "Роберт Энгл"}, "cat": "Economics", "year": 2003, "topic": {"en": "methods for analysing time series with time-varying volatility (ARCH)", "kk": "өзгермелі волатильділігі бар уақыттық қатарларды талдау әдістері (ARCH)", "ru": "методы анализа временных рядов с изменяющейся волатильностью (ARCH)"}}], "answer": 2, "physicist": {"name": {"en": "Robert Engle", "kk": "Роберт Энгл", "ru": "Роберт Энгл"}, "cat": "Economics", "year": 2003, "topic": {"en": "methods for analysing time series with time-varying volatility (ARCH)", "kk": "өзгермелі волатильділігі бар уақыттық қатарларды талдау әдістері (ARCH)", "ru": "методы анализа временных рядов с изменяющейся волатильностью (ARCH)"}, "bg": {"en": "BS in physics at Williams College and MS in physics at Cornell (1966), then a PhD in economics at Cornell (1969). Professor at MIT (1969-77), then UC San Diego, now at New York University.", "kk": "Уильямс колледжінде физика бакалавры және Корнеллде физика магистрі (1966), кейін Корнеллде экономика бойынша докторлық (1969). MIT-те (1969–77), кейін Сан-Диегодағы Калифорния университетінде профессор, қазір Нью-Йорк университетінде.", "ru": "Бакалавр физики в колледже Уильямса и магистр физики в Корнелле (1966), затем докторская по экономике в Корнелле (1969). Профессор в MIT (1969–77), затем в Калифорнийском университете в Сан-Диего, ныне в Нью-Йоркском университете."}, "helped": {"en": "Trained to model fluctuating signals, he noticed that volatility in financial markets comes in clusters. His ARCH model (1982) lets the variance of a series change over time, and it is now the standard tool for pricing options and measuring risk.", "kk": "Тербелмелі сигналдарды модельдеуге үйренген ол қаржы нарықтарындағы волатильділіктің кластерлермен келетінін байқады. Оның ARCH моделі (1982) қатардың дисперсиясының уақыт бойынша өзгеруіне мүмкіндік береді және опциондарды бағалау мен тәуекелді өлшеудің стандартты құралына айналды.", "ru": "Приученный моделировать колеблющиеся сигналы, он заметил, что волатильность на финансовых рынках приходит кластерами. Его модель ARCH (1982) позволяет дисперсии ряда меняться во времени и стала стандартным инструментом для оценки опционов и измерения риска."}}}, {"n": 26, "options": [{"name": {"en": "Barry Marshall", "kk": "Барри Маршалл", "ru": "Барри Маршалл"}, "cat": "Medicine", "year": 2005, "topic": {"en": "Helicobacter pylori and stomach ulcers", "kk": "Helicobacter pylori және асқазан жарасы", "ru": "Helicobacter pylori и язва желудка"}}, {"name": {"en": "Fritz Haber", "kk": "Фриц Габер", "ru": "Фриц Габер"}, "cat": "Chemistry", "year": 1918, "topic": {"en": "synthesis of ammonia from its elements", "kk": "аммиакты элементтерден синтездеу", "ru": "синтез аммиака из элементов"}}, {"name": {"en": "Walther Nernst", "kk": "Вальтер Нернст", "ru": "Вальтер Нернст"}, "cat": "Chemistry", "year": 1920, "topic": {"en": "thermochemistry and the third law of thermodynamics", "kk": "термохимия және термодинамиканың үшінші заңы", "ru": "термохимия и третье начало термодинамики"}}], "answer": 2, "physicist": {"name": {"en": "Walther Nernst", "kk": "Вальтер Нернст", "ru": "Вальтер Нернст"}, "cat": "Chemistry", "year": 1920, "topic": {"en": "thermochemistry and the third law of thermodynamics", "kk": "термохимия және термодинамиканың үшінші заңы", "ru": "термохимия и третье начало термодинамики"}, "bg": {"en": "Studied physics and mathematics at Zurich, Berlin, Graz and Würzburg, where he took his doctorate in 1887 under the physicist Friedrich Kohlrausch. Professor at Göttingen for eighteen years, then in Berlin.", "kk": "Цюрих, Берлин, Грац және Вюрцбургте физика мен математиканы оқыды, Вюрцбургте 1887 жылы физик Фридрих Кольрауштың жетекшілігімен докторлық қорғады. Он сегіз жыл Гёттингенде, кейін Берлинде профессор.", "ru": "Изучал физику и математику в Цюрихе, Берлине, Граце и Вюрцбурге, где в 1887 году защитил докторскую у физика Фридриха Кольрауша. Восемнадцать лет профессор в Гёттингене, затем в Берлине."}, "helped": {"en": "His heat theorem of 1905, now the third law of thermodynamics, came from treating chemical equilibrium as a problem in thermodynamics. The Nernst equation (1887) links the voltage of an electrochemical cell to concentrations, and he invented the Nernst lamp, selling the patent for a million marks.", "kk": "Оның 1905 жылғы жылу теоремасы — қазіргі термодинамиканың үшінші заңы — химиялық тепе-теңдікті термодинамика есебі ретінде қараудан туды. Нернст теңдеуі (1887) электрохимиялық элементтің кернеуін концентрацияларға байланыстырады, ал өзі ойлап тапқан Нернст шамының патентін миллион маркаға сатты.", "ru": "Его тепловая теорема 1905 года, ныне третье начало термодинамики, родилась из рассмотрения химического равновесия как задачи термодинамики. Уравнение Нернста (1887) связывает напряжение электрохимического элемента с концентрациями, а патент на изобретённую им лампу Нернста он продал за миллион марок."}}}, {"n": 27, "options": [{"name": {"en": "Ahmed Zewail", "kk": "Ахмед Зевейл", "ru": "Ахмед Зевейл"}, "cat": "Chemistry", "year": 1999, "topic": {"en": "femtosecond spectroscopy of chemical reactions", "kk": "химиялық реакциялардың фемтосекундтық спектроскопиясы", "ru": "фемтосекундная спектроскопия химических реакций"}}, {"name": {"en": "Maria Ressa", "kk": "Мария Ресса", "ru": "Мария Ресса"}, "cat": "Peace", "year": 2021, "topic": {"en": "safeguarding freedom of expression", "kk": "сөз бостандығын қорғау", "ru": "защита свободы слова"}}, {"name": {"en": "Maurice Wilkins", "kk": "Морис Уилкинс", "ru": "Морис Уилкинс"}, "cat": "Medicine", "year": 1962, "topic": {"en": "the molecular structure of DNA", "kk": "ДНҚ-ның молекулалық құрылымы", "ru": "молекулярная структура ДНК"}}], "answer": 2, "physicist": {"name": {"en": "Maurice Wilkins", "kk": "Морис Уилкинс", "ru": "Морис Уилкинс"}, "cat": "Medicine", "year": 1962, "topic": {"en": "the molecular structure of DNA", "kk": "ДНҚ-ның молекулалық құрылымы", "ru": "молекулярная структура ДНК"}, "bg": {"en": "Read physics at St John's College, Cambridge (BA 1938), then a PhD at Birmingham (1940) under John Randall on phosphorescence. Worked on radar and then on isotope separation for the Manhattan Project at Berkeley (1944-45).", "kk": "Кембридждегі Әулие Иоанн колледжінде физиканы оқыды (бакалавр 1938), Бирмингемде Джон Рэндаллдың жетекшілігімен фосфоресценция бойынша докторлық (1940). Радармен, кейін Берклиде Манхэттен жобасында изотоптарды бөлумен айналысты (1944–45).", "ru": "Изучал физику в колледже Св. Иоанна в Кембридже (бакалавр 1938), докторская в Бирмингеме (1940) у Джона Рэндалла по фосфоресценции. Работал над радаром, затем над разделением изотопов в Манхэттенском проекте в Беркли (1944–45)."}, "helped": {"en": "At King's College London he started the X-ray diffraction study of DNA fibres and by 1950 had some of the first high-quality images. His and Franklin's diffraction data were what Watson and Crick's model had to explain, and his confirmatory images appeared in the same issue of Nature in 1953.", "kk": "Лондондағы Король колледжінде ол ДНҚ талшықтарының рентгендік дифракциясын бастап, 1950 жылға қарай алғашқы сапалы суреттердің бірін алды. Уотсон мен Крик моделі дәл оның және Франклиннің дифракциялық деректерін түсіндіруге тиіс еді, ал оның растаушы суреттері 1953 жылы Nature журналының сол санында жарияланды.", "ru": "В Королевском колледже Лондона он начал рентгеновскую дифракцию волокон ДНК и к 1950 году получил одни из первых качественных снимков. Именно его и Франклин дифракционные данные должна была объяснить модель Уотсона и Крика, а его подтверждающие снимки вышли в том же номере Nature в 1953 году."}}}, {"n": 28, "options": [{"name": {"en": "Svante Pääbo", "kk": "Сванте Пэабо", "ru": "Сванте Пэабо"}, "cat": "Medicine", "year": 2022, "topic": {"en": "genomes of extinct hominins (Neanderthals)", "kk": "жойылып кеткен гоминидтердің геномдары (неандертальдықтар)", "ru": "геномы вымерших гоминин (неандертальцы)"}}, {"name": {"en": "Max Delbrück", "kk": "Макс Дельбрюк", "ru": "Макс Дельбрюк"}, "cat": "Medicine", "year": 1969, "topic": {"en": "replication mechanism and genetic structure of viruses", "kk": "вирустардың репликация механизмі және генетикалық құрылымы", "ru": "механизм репликации и генетическая структура вирусов"}}, {"name": {"en": "Mikhail Sholokhov", "kk": "Михаил Шолохов", "ru": "Михаил Шолохов"}, "cat": "Literature", "year": 1965, "topic": {"en": "'And Quiet Flows the Don', epic of the Don Cossacks", "kk": "«Тынық Дон», Дон казактарының эпосы", "ru": "«Тихий Дон», эпос донского казачества"}}], "answer": 1, "physicist": {"name": {"en": "Max Delbrück", "kk": "Макс Дельбрюк", "ru": "Макс Дельбрюк"}, "cat": "Medicine", "year": 1969, "topic": {"en": "replication mechanism and genetic structure of viruses", "kk": "вирустардың репликация механизмі және генетикалық құрылымы", "ru": "механизм репликации и генетическая структура вирусов"}, "bg": {"en": "PhD in theoretical physics at Göttingen (1930), then time with Niels Bohr in Copenhagen and, from 1932, assistant to Lise Meitner in Berlin. Delbrück scattering of gamma rays carries his name.", "kk": "Гёттингенде теориялық физика бойынша докторлық (1930), кейін Копенгагенде Нильс Бордың қасында, 1932 жылдан Берлинде Лизе Мейтнердің ассистенті. Гамма-сәулелердің Дельбрюк шашырауы оның атымен аталады.", "ru": "Докторская по теоретической физике в Гёттингене (1930), затем работа у Нильса Бора в Копенгагене и с 1932 года ассистент Лизе Мейтнер в Берлине. Дельбрюковское рассеяние гамма-лучей носит его имя."}, "helped": {"en": "Inspired by Bohr's ideas, he went looking for the 'hydrogen atom of biology' and chose bacteriophages as the simplest system. His 1935 paper with Timofeev-Ressovsky and Zimmer on the physical nature of gene mutation inspired Schrödinger's 'What is Life?' (1944), and his Phage Group founded molecular biology.", "kk": "Бордың идеяларынан шабыт алып, ол «биологияның сутегі атомын» іздеп, ең қарапайым жүйе ретінде бактериофагтарды таңдады. Тимофеев-Ресовский және Циммермен бірге жазған 1935 жылғы ген мутациясының физикалық табиғаты туралы мақаласы Шрёдингердің «Өмір деген не?» кітабына (1944) шабыт берді, ал оның «фаг тобы» молекулалық биологияның негізін қалады.", "ru": "Вдохновлённый идеями Бора, он отправился искать «атом водорода в биологии» и выбрал бактериофаги как простейшую систему. Его статья 1935 года с Тимофеевым-Ресовским и Циммером о физической природе мутации гена вдохновила книгу Шрёдингера «Что такое жизнь?» (1944), а его «фаговая группа» основала молекулярную биологию."}}}, {"n": 29, "options": [{"name": {"en": "Venki Ramakrishnan", "kk": "Венки Рамакришнан", "ru": "Венки Рамакришнан"}, "cat": "Chemistry", "year": 2009, "topic": {"en": "structure and function of the ribosome", "kk": "рибосоманың құрылымы мен қызметі", "ru": "структура и функция рибосомы"}}, {"name": {"en": "Mario Vargas Llosa", "kk": "Марио Варгас Льоса", "ru": "Марио Варгас Льоса"}, "cat": "Literature", "year": 2010, "topic": {"en": "'The Feast of the Goat'; images of power and resistance", "kk": "«Теке мерекесі»; билік пен қарсылық бейнелері", "ru": "«Праздник Козла»; образы власти и сопротивления"}}, {"name": {"en": "Paul Krugman", "kk": "Пол Кругман", "ru": "Пол Кругман"}, "cat": "Economics", "year": 2008, "topic": {"en": "trade patterns and the location of economic activity", "kk": "сауда құрылымы және экономикалық белсенділіктің орналасуы", "ru": "структура торговли и размещение экономической активности"}}], "answer": 0, "physicist": {"name": {"en": "Venki Ramakrishnan", "kk": "Венки Рамакришнан", "ru": "Венки Рамакришнан"}, "cat": "Chemistry", "year": 2009, "topic": {"en": "structure and function of the ribosome", "kk": "рибосоманың құрылымы мен қызметі", "ru": "структура и функция рибосомы"}, "bg": {"en": "BSc in physics at Baroda and PhD in physics at Ohio University (1976). Only then did he retrain in biology as a graduate student at UC San Diego. Later President of the Royal Society.", "kk": "Бародада физика бакалавры және Огайо университетінде физика бойынша докторлық (1976). Тек содан кейін Сан-Диегодағы Калифорния университетінде биологияны қайта оқыды. Кейін Лондон корольдік қоғамының президенті болды.", "ru": "Бакалавр физики в Бароде и докторская по физике в Университете Огайо (1976). Лишь после этого переучился на биолога в аспирантуре Калифорнийского университета в Сан-Диего. Позже — президент Лондонского королевского общества."}, "helped": {"en": "X-ray crystallography and neutron scattering are physics tools, and he used them to solve the structure of the small ribosomal subunit (2000), the molecular machine that translates the genetic code into protein, and to show how antibiotics jam it.", "kk": "Рентгендік кристаллография мен нейтрондардың шашырауы — физика құралдары, ол солардың көмегімен генетикалық кодты ақуызға аударатын молекулалық машина — рибосоманың кіші суббірлігінің құрылымын шешті (2000) және антибиотиктердің оны қалай тоқтататынын көрсетті.", "ru": "Рентгеновская кристаллография и рассеяние нейтронов — инструменты физики, и с их помощью он расшифровал структуру малой субъединицы рибосомы (2000) — молекулярной машины, переводящей генетический код в белок, — и показал, как антибиотики её блокируют."}}}, {"n": 30, "options": [{"name": {"en": "Edwin McMillan", "kk": "Эдвин Макмиллан", "ru": "Эдвин Макмиллан"}, "cat": "Chemistry", "year": 1951, "topic": {"en": "discoveries in the chemistry of the transuranium elements (neptunium)", "kk": "трансуран элементтерінің химиясындағы жаңалықтар (нептуний)", "ru": "открытия в химии трансурановых элементов (нептуний)"}}, {"name": {"en": "Albert Camus", "kk": "Альбер Камю", "ru": "Альбер Камю"}, "cat": "Literature", "year": 1957, "topic": {"en": "'The Stranger'; problems of the human conscience", "kk": "«Бөтен»; адам ар-ұжданының мәселелері", "ru": "«Посторонний»; проблемы человеческой совести"}}, {"name": {"en": "Ernest Hemingway", "kk": "Эрнест Хемингуэй", "ru": "Эрнест Хемингуэй"}, "cat": "Literature", "year": 1954, "topic": {"en": "mastery of narrative; 'The Old Man and the Sea'", "kk": "баяндау шеберлігі; «Шал мен теңіз»", "ru": "мастерство повествования; «Старик и море»"}}], "answer": 0, "physicist": {"name": {"en": "Edwin McMillan", "kk": "Эдвин Макмиллан", "ru": "Эдвин Макмиллан"}, "cat": "Chemistry", "year": 1951, "topic": {"en": "discoveries in the chemistry of the transuranium elements (neptunium)", "kk": "трансуран элементтерінің химиясындағы жаңалықтар (нептуний)", "ru": "открытия в химии трансурановых элементов (нептуний)"}, "bg": {"en": "PhD in physics at Princeton (1933), then a nuclear physicist at Lawrence's Radiation Laboratory in Berkeley. Co-invented the synchrotron (1945, independently of Veksler) and directed the Lawrence Berkeley Laboratory from 1958 to 1973.", "kk": "Принстонда физика бойынша докторлық (1933), кейін Берклидегі Лоуренс радиациялық зертханасында ядролық физик. Синхротронды ойлап тапқандардың бірі (1945, Векслерден тәуелсіз), 1958–1973 жылдары Берклидегі Лоуренс зертханасының директоры.", "ru": "Докторская по физике в Принстоне (1933), затем физик-ядерщик в Радиационной лаборатории Лоуренса в Беркли. Один из изобретателей синхротрона (1945, независимо от Векслера), директор Лаборатории Лоуренса в Беркли в 1958–1973 годах."}, "helped": {"en": "Bombarding uranium with cyclotron neutrons, he tracked the new element 93 by its radioactive half-life and beta decay, a nuclear physics technique, rather than by classical chemistry. It was the first element beyond uranium.", "kk": "Уранды циклотрон нейтрондарымен атқылап, ол жаңа 93-элементті классикалық химиямен емес, ядролық физика әдісімен — жартылай ыдырау периоды мен бета-ыдырауы арқылы тапты. Бұл ураннан кейінгі алғашқы элемент еді.", "ru": "Облучая уран нейтронами из циклотрона, он выследил новый элемент 93 по периоду полураспада и бета-распаду — методом ядерной физики, а не классической химии. Это был первый элемент за ураном."}}}];

"Таңдалды. Дайын болғанда ашыңыз", "hint_done": "Кері аударыңыз немесе тақтаға оралыңыз", "v_none": "Физик — {a}", "v_ok": "Дұрыс · {a}", "v_bad": "{p} емес · физик — {a}", "why": "Неге физик", "how": "Физика қалай көмектесті", "reveal": "Ашу", "flipback": "Кері аудару", "showanswer": "Жауапты көрсету", "done": "Тақтаға оралу ▶", "cardkeys": "<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> таңдау · <kbd>Space</kbd> ашу · <kbd>Esc</kbd> тақта", "footer": "30 карта · әр картада бір физик · химия, медицина, әдебиет, бейбітшілік, экономика сыйлықтары", "prizeline": "{prize}, {year}: {topic}", "meta": "{prize} · {year}"}, "ru": {"lang": "ru", "title": "Найди физика", "eyebrow": "Кафедра физики · Нобелевский скан", "opened": "ОТКРЫТО", "correct": "ВЕРНО", "intro": "Тридцать карт лежат рубашкой вверх. Выберите номер: под ним среди двух других нобелевских лауреатов прячется один физик.", "shuffle": "⟲ Перемешать", "reset": "Сбросить", "boardkeys": "Перемешать — заново раздаёт неоткрытые карты · Сбросить — очищает доску", "tap": "НАЖМИ", "openedtile": "ОТКРЫТО", "back": "◀ Доска", "tile": "КАРТА", "card": "КАРТА", "laureates": "Нобелевские лауреаты", "decoded": "Ответ", "question": "Один из этих трёх лауреатов — физик по образованию. Кто?", "hint_pick": "Выберите ответ, затем откройте", "hint_locked": "Выбор сделан. Откройте, когда будете готовы", "hint_done": "Переверните обратно или вернитесь к доске", "v_none": "Физик — {a}", "v_ok": "Верно · {a}", "v_bad": "Не {p} · физик — {a}", "why": "Почему физик", "how": "Как помогла физика", "reveal": "Открыть", "flipback": "Перевернуть", "showanswer": "Показать ответ", "done": "К доске ▶", "cardkeys": "<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> выбор · <kbd>Space</kbd> открыть · <kbd>Esc</kbd> доска", "footer": "30 карт · по одному физику на карте · премии по химии, медицине, литературе, миру, экономике", "prizeline": "{prize} {year}: {topic}", "meta": "{prize} · {year}"}};
const PRIZE = {"Chemistry": {"en": "Nobel Prize in Chemistry", "kk": "Химия бойынша Нобель сыйлығы", "ru": "Нобелевская премия по химии"}, "Medicine": {"en": "Nobel Prize in Medicine", "kk": "Медицина бойынша Нобель сыйлығы", "ru": "Нобелевская премия по медицине"}, "Literature": {"en": "Nobel Prize in Literature", "kk": "Әдебиет бойынша Нобель сыйлығы", "ru": "Нобелевская премия по литературе"}, "Peace": {"en": "Nobel Peace Prize", "kk": "Нобель бейбітшілік сыйлығы", "ru": "Нобелевская премия мира"}, "Economics": {"en": "Nobel Prize in Economics", "kk": "Экономика бойынша Нобель сыйлығы", "ru": "Нобелевская премия по экономике"}};
const L = ["A","B","C"];
const N = CARDS.length;
let lang = "en";
let deal = CARDS.map((_,i)=>i);
const st = CARDS.map(()=>({picked:null, revealed:false}));
let cur = null;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffleArr = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const T = k => UI[lang][k];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_,k)=>o[k]);

function setLang(l){
  lang = UI[l] ? l : "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(el => { el.innerHTML = T(el.dataset.tHtml); });
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  try { localStorage.setItem("npq-lang", lang); } catch(e) {}
  if (cur === null) renderBoard(false); else renderCard();
}

function stats(){
  const done = st.filter(s=>s.revealed).length;
  const ok = st.filter((s,i)=>s.revealed && s.picked===CARDS[i].answer).length;
  $("s-done").textContent = done + " / " + N; $("s-ok").textContent = ok;
  $("bar").style.width = (done/N*100) + "%";
}

function renderBoard(spin){
  const b = $("board"); b.innerHTML = "";
  for (let t=0;t<N;t++){
    const c = deal[t], s = st[c];
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "tile"; btn.dataset.t = t;
    if (s.revealed) btn.classList.add("done", s.picked===CARDS[c].answer ? "ok" : "bad");
    btn.setAttribute("aria-label", T("card") + " " + (t+1));
    btn.innerHTML = `<div class="tface"><span class="tnum">${pad(t+1)}</span>
      <span class="tsub">${s.revealed ? T("openedtile") : T("tap")}</span>
      ${s.revealed ? `<span class="mark">${s.picked===CARDS[c].answer ? "✓" : "✕"}</span>` : ""}</div>`;
    btn.addEventListener("click", ()=>openTile(t));
    if (spin && !s.revealed){ btn.style.transitionDelay = (t*20) + "ms"; requestAnimationFrame(()=>requestAnimationFrame(()=>btn.classList.add("spin"))); }
    b.appendChild(btn);
  }
  stats();
}
function shuffle(){
  const tiles = [], left = [];
  for (let t=0;t<N;t++){ if (!st[deal[t]].revealed){ tiles.push(t); left.push(deal[t]); } }
  shuffleArr(left); tiles.forEach((t,i)=>{ deal[t] = left[i]; });
  renderBoard(true);
}
function reset(){ st.forEach(s=>{s.picked=null; s.revealed=false}); shuffleArr(deal); renderBoard(true); }

function openTile(t){
  cur = t;
  $("card").dataset.showBack = "0"; $("card").classList.remove("flipped");
  $("view-board").classList.add("hide"); $("view-card").classList.add("show");
  renderCard(); window.scrollTo({top:0, behavior:"smooth"});
}
function toBoard(){
  cur = null;
  $("view-card").classList.remove("show"); $("view-board").classList.remove("hide");
  renderBoard(false);
}
function renderCard(){
  const c = CARDS[deal[cur]], s = st[deal[cur]];
  $("tile-id").textContent = T("tile") + " " + pad(cur+1);
  $("f-tag").textContent = T("card") + " " + pad(cur+1);
  $("b-tag").textContent = T("card") + " " + pad(cur+1);
  const opts = $("opts"); opts.innerHTML = "";
  c.options.forEach((o,i)=>{
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = `<span class="letter">${L[i]}</span><span><div class="oname">${esc(o.name[lang])}</div>
      <div class="ometa">${esc(fmt(T("meta"), {prize: PRIZE[o.cat][lang].toUpperCase(), year: o.year}))}</div><div class="otopic">${esc(o.topic[lang])}</div></span>`;
    if (s.picked === i) b.classList.add("picked");
    if (s.revealed){ b.disabled = true; if (i===c.answer) b.classList.add("correct"); else if (i===s.picked) b.classList.add("wrong"); }
    b.addEventListener("click", ()=>pick(i));
    li.appendChild(b); opts.appendChild(li);
  });
  $("hint").textContent = s.revealed ? T("hint_done") : (s.picked===null ? T("hint_pick") : T("hint_locked"));
  const p = c.physicist, v = $("verdict");
  if (s.picked === null){ v.className="verdict none"; v.textContent = fmt(T("v_none"), {a: L[c.answer]}); }
  else if (s.picked === c.answer){ v.className="verdict ok"; v.textContent = fmt(T("v_ok"), {a: L[c.answer]}); }
  else { v.className="verdict bad"; v.textContent = fmt(T("v_bad"), {p: L[s.picked], a: L[c.answer]}); }
  $("pname").textContent = p.name[lang];
  $("pprize").textContent = fmt(T("prizeline"), {prize: PRIZE[p.cat][lang], year: p.year, topic: p.topic[lang]});
  $("pbg").textContent = p.bg[lang]; $("phelp").textContent = p.helped[lang];
  const card = $("card");
  card.classList.toggle("flipped", s.revealed && card.dataset.showBack === "1");
  const showingBack = card.classList.contains("flipped");
  const r = $("reveal");
  r.textContent = showingBack ? T("flipback") : (s.revealed ? T("showanswer") : T("reveal"));
  r.classList.toggle("mag", showingBack);
  $("done").hidden = !s.revealed;
  stats();
}
function pick(i){ const s = st[deal[cur]]; if (s.revealed) return; s.picked = i; renderCard(); }
function reveal(){
  const s = st[deal[cur]], card = $("card");
  if (!s.revealed){ s.revealed = true; card.dataset.showBack = "1"; }
  else card.dataset.showBack = card.dataset.showBack === "1" ? "0" : "1";
  renderCard();
}

$("shuffle").addEventListener("click", shuffle);
$("reset").addEventListener("click", reset);
$("back").addEventListener("click", toBoard);
$("done").addEventListener("click", toBoard);
$("reveal").addEventListener("click", reveal);
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", ()=>setLang(b.dataset.lang)));
document.addEventListener("keydown", e=>{
  if (cur === null) return;
  if (e.key==="1"||e.key==="2"||e.key==="3") pick(+e.key-1);
  else if (e.key===" "||e.key==="Enter"){ if (e.target.tagName!=="BUTTON"){ e.preventDefault(); reveal(); } }
  else if (e.key==="Escape") toBoard();
});

shuffleArr(deal);
(function(){
  let l = null;
  try { l = localStorage.getItem("npq-lang"); } catch(e) {}
  if (!l){ const nav = (navigator.language||"").toLowerCase(); l = nav.startsWith("kk") ? "kk" : nav.startsWith("ru") ? "ru" : "en"; }
  setLang(l);
})();

/* ambient neural-net canvas */
(function(){
  const cv = $("net"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,pts=[];
  function size(){ W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio;
    const n = Math.min(90, Math.floor(innerWidth*innerHeight/14000));
    pts = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25*devicePixelRatio,vy:(Math.random()-.5)*.25*devicePixelRatio}));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const d = 150*devicePixelRatio;
    for (const p of pts){ if(!reduce){p.x+=p.vx;p.y+=p.vy;} if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; }
    for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
      if (dist<d){ ctx.strokeStyle=`rgba(53,229,255,${(1-dist/d)*.35})`; ctx.lineWidth=devicePixelRatio; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    ctx.fillStyle="rgba(53,229,255,.8)";
    for (const p of pts){ ctx.beginPath(); ctx.arc(p.x,p.y,1.4*devicePixelRatio,0,Math.PI*2); ctx.fill(); }
    if (!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize", ()=>{size(); if(reduce) draw();});
  size(); draw();
})();
</script>
