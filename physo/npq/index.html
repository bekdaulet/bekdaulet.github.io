<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Spot the Physicist · Физикті тап · Найди физика</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070b14'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2335e5ff'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='10' fill='none' stroke='%2335e5ff' stroke-width='2.5' transform='rotate(-30 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='24' ry='10' fill='none' stroke='%23ff4fd8' stroke-width='2.5' transform='rotate(30 32 32)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070b14; --bg2:#0b1222; --panel:#0e1729; --panel2:#111d33;
  --line:#1e2f4d; --line2:#2b4470;
  --text:#e6f1ff; --muted:#7f90ad; --dim:#4b5b78;
  --cyan:#35e5ff; --cyan2:#14b8d4; --mag:#ff4fd8; --ok:#3dffb0; --bad:#ff5c7a;
  --glow:0 0 18px rgba(53,229,255,.35), 0 0 60px rgba(53,229,255,.12);
  --display:"Orbitron","Rajdhani",system-ui,sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
  --mono:"Share Tech Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-inline:16px;padding-block:0;overflow-x:hidden;position:relative}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 0%,rgba(53,229,255,.10),transparent 70%),
             radial-gradient(40% 40% at 90% 100%,rgba(255,79,216,.08),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-block:22px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%}

/* HUD header */
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan2)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(20px,4.6vw,30px);margin:0;letter-spacing:.04em;text-wrap:balance;
  background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.stats b{display:block;color:var(--text);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan2),var(--cyan));box-shadow:var(--glow);transition:width .4s ease}

/* card stage */
.stage{perspective:1600px}
.card{position:relative;display:grid;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2);border-radius:14px;
  background:linear-gradient(160deg,var(--panel2),var(--panel));padding:26px 26px 22px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(53,229,255,.06);position:relative;overflow:hidden}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(53,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(53,229,255,.05) 1px,transparent 1px);
  background-size:28px 28px;mask-image:radial-gradient(80% 60% at 50% 0%,#000,transparent)}
.face::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.8}
.back{transform:rotateY(180deg);border-color:rgba(255,79,216,.45)}
.back::after{background:linear-gradient(90deg,transparent,var(--mag),transparent)}
.corner{position:absolute;width:14px;height:14px;border-color:var(--cyan);border-style:solid;opacity:.7}
.corner.tl{top:8px;left:8px;border-width:2px 0 0 2px}.corner.tr{top:8px;right:8px;border-width:2px 2px 0 0}
.corner.bl{bottom:8px;left:8px;border-width:0 0 2px 2px}.corner.br{bottom:8px;right:8px;border-width:0 2px 2px 0}
.back .corner{border-color:var(--mag)}
.tag{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tag span:last-child{color:var(--cyan2)}
.back .tag span:last-child{color:var(--mag)}
.q{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.6vw,19px);line-height:1.35;letter-spacing:.01em;margin:0;text-wrap:balance}

.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;width:100%;text-align:left;background:rgba(7,11,20,.55);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer;
  transition:border-color .2s,box-shadow .2s,transform .2s,background .2s}
.opt:hover{border-color:var(--cyan2);transform:translateX(3px)}
.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.opt.picked{border-color:var(--cyan);box-shadow:var(--glow);background:rgba(53,229,255,.07)}
.opt.correct{border-color:var(--ok);box-shadow:0 0 18px rgba(61,255,176,.35);background:rgba(61,255,176,.08)}
.opt.wrong{border-color:var(--bad);background:rgba(255,92,122,.08)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{transform:none}
.letter{width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--cyan)}
.opt.picked .letter{border-color:var(--cyan);background:rgba(53,229,255,.15)}
.opt.correct .letter{border-color:var(--ok);color:var(--ok);background:rgba(61,255,176,.15)}
.opt.wrong .letter{border-color:var(--bad);color:var(--bad)}
.oname{font-weight:700;font-size:20px;line-height:1.15}
.ometa{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.ometa b{color:var(--text);font-weight:400}
.otopic{font-size:15.5px;color:#b9c6df;margin-top:3px;line-height:1.3}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:auto}

/* back face */
.verdict{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:6px 10px;border-radius:6px;width:max-content;max-width:100%}
.verdict.ok{color:var(--ok);border:1px solid rgba(61,255,176,.5);background:rgba(61,255,176,.08)}
.verdict.bad{color:var(--bad);border:1px solid rgba(255,92,122,.5);background:rgba(255,92,122,.08)}
.verdict.none{color:var(--cyan);border:1px solid rgba(53,229,255,.5);background:rgba(53,229,255,.08)}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(22px,4.6vw,30px);margin:0;line-height:1.15;letter-spacing:.02em;
  background:linear-gradient(90deg,#fff,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.pprize{font-size:16px;color:#b9c6df;margin:0;line-height:1.35}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.sec p{margin:0;font-size:16.5px;line-height:1.45;max-width:62ch}

/* controls */
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:14px 22px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel);color:var(--text);cursor:pointer;transition:all .2s;min-width:120px}
.btn:hover{border-color:var(--cyan2);color:var(--cyan)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:default}
.btn[disabled]:hover{border-color:var(--line2);color:var(--text)}
.btn.primary{background:linear-gradient(90deg,var(--cyan2),var(--cyan));color:#04121a;border-color:transparent;box-shadow:var(--glow);min-width:180px;font-size:15px}
.btn.primary:hover{filter:brightness(1.1);color:#04121a}
.btn.primary.mag{background:linear-gradient(90deg,#c22ea3,var(--mag));box-shadow:0 0 18px rgba(255,79,216,.35)}
.keys{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.keys kbd{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted);font:inherit}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}
.foot button{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;letter-spacing:inherit;text-decoration:underline dotted;padding:0}
.foot button:hover{color:var(--cyan)}

/* final screen */
.final{text-align:center;display:none;flex-direction:column;gap:14px;align-items:center;padding:30px 0}
.final.show{display:flex}
.final .big{font-family:var(--display);font-weight:900;font-size:clamp(40px,10vw,72px);line-height:1;
  background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.final p{margin:0;color:var(--muted);max-width:44ch}

@media (max-width:480px){
  .face{padding:20px 16px 18px}
  .opt{grid-template-columns:34px 1fr;gap:10px;padding:10px 12px}
  .letter{width:34px;height:34px;font-size:13px}
  .oname{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}.opt,.btn{transition:none}
}

/* board */
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.board-head p{margin:0;color:var(--muted);font-size:16px;max-width:52ch}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;perspective:1200px}
.tile{aspect-ratio:3/4;position:relative;border:none;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);font:inherit;color:var(--text)}
.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:12px}
.tile.spin{transform:rotateY(360deg)}
.tface{position:absolute;inset:0;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;
  background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
.tface::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(53,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(53,229,255,.06) 1px,transparent 1px);background-size:14px 14px}
.tface::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}
.tile:hover .tface{border-color:var(--cyan);box-shadow:var(--glow);transform:translateY(-4px)}
.tnum{font-family:var(--display);font-weight:900;font-size:clamp(22px,4.2vw,36px);letter-spacing:.04em;color:var(--cyan);position:relative;
  text-shadow:0 0 14px rgba(53,229,255,.5)}
.tsub{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
.tile.done .tface{background:linear-gradient(160deg,#0c1220,#0a0f1a);border-color:var(--line)}
.tile.done .tnum{color:var(--dim);text-shadow:none}
.tile.ok .tface{border-color:rgba(61,255,176,.6)} .tile.ok .tface::after{background:linear-gradient(90deg,transparent,var(--ok),transparent)}
.tile.bad .tface{border-color:rgba(255,92,122,.6)} .tile.bad .tface::after{background:linear-gradient(90deg,transparent,var(--bad),transparent)}
.mark{position:absolute;top:8px;right:10px;font-family:var(--display);font-weight:700;font-size:14px}
.tile.ok .mark{color:var(--ok)} .tile.bad .mark{color:var(--bad)}
.tile.done:hover .tface{transform:none;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.board-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#view-card{display:none;flex-direction:column;gap:18px}
#view-card.show{display:flex}
#view-board{display:flex;flex-direction:column;gap:18px}
#view-board.hide{display:none}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tile-id{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--cyan)}
@media (max-width:560px){.board{grid-template-columns:repeat(4,1fr);gap:9px}.tnum{font-size:22px}.tsub{display:none}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}

.langs{display:flex;gap:4px;align-items:center}
.langs button{font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:7px 10px;border-radius:6px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.langs button:hover{color:var(--cyan);border-color:var(--cyan2)}
.langs button.on{color:#04121a;background:linear-gradient(90deg,var(--cyan2),var(--cyan));border-color:transparent;box-shadow:var(--glow)}
.langs button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hud{align-items:center}
.hud-right{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
@media (max-width:560px){.hud-right{align-items:flex-start}}
.board{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.board{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="hud">
    <div class="brand">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
    </div>
    <div class="hud-right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="kk">ҚАЗ</button>
        <button type="button" data-lang="ru">РУС</button>
      </div>
      <div class="stats">
        <div><span data-t="opened"></span><b id="s-done">0 / 30</b></div>
        <div><span data-t="correct"></span><b id="s-ok">0</b></div>
      </div>
    </div>
  </header>
  <div class="progress"><i id="bar"></i></div>

  <section id="view-board">
    <div class="board-head">
      <p data-t="intro"></p>
      <div class="board-actions">
        <button class="btn primary" id="shuffle" data-t="shuffle"></button>
        <button class="btn" id="reset" data-t="reset"></button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="keys" data-t="boardkeys"></div>
  </section>

  <section id="view-card">
    <div class="topline">
      <button class="btn" id="back" data-t="back"></button>
      <span class="tile-id" id="tile-id"></span>
    </div>
    <div class="stage" id="stage">
      <div class="card" id="card">
        <div class="face front">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="tag"><span id="f-tag"></span><span data-t="laureates"></span></div>
          <p class="q" data-t="question"></p>
          <ul class="opts" id="opts"></ul>
          <div class="hint" id="hint"></div>
        </div>
        <div class="face back">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="tag"><span id="b-tag"></span><span data-t="decoded"></span></div>
          <div class="verdict none" id="verdict"></div>
          <h2 class="pname" id="pname"></h2>
          <p class="pprize" id="pprize"></p>
          <div class="sec"><h3 data-t="why"></h3><p id="pbg"></p></div>
          <div class="sec"><h3 data-t="how"></h3><p id="phelp"></p></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="reveal"></button>
      <button class="btn" id="done" hidden data-t="done"></button>
    </div>
    <div class="keys" data-t-html="cardkeys"></div>
  </section>

  <footer class="foot"><span data-t="footer"></span></footer>
</div>

<script>
const CARDS = [{"n": 1, "options": [{"name": {"en": "Frederick Banting", "kk": "Фредерик Бантинг", "ru": "Фредерик Бантинг"}, "cat": "Medicine", "year": 1923, "topic": {"en": "discovery of insulin", "kk": "инсулиннің ашылуы", "ru": "открытие инсулина"}}, {"name": {"en": "Francis Crick", "kk": "Фрэнсис Крик", "ru": "Фрэнсис Крик"}, "cat": "Medicine", "year": 1962, "topic": {"en": "the molecular structure of DNA", "kk": "ДНҚ-ның молекулалық құрылымы", "ru": "молекулярная структура ДНК"}}, {"name": {"en": "Mikhail Gorbachev", "kk": "Михаил Горбачёв", "ru": "Михаил Горбачёв"}, "cat": "Peace", "year": 1990, "topic": {"en": "radical changes in East-West relations, end of the Cold War", "kk": "Шығыс пен Батыс қатынастарындағы өзгерістер, қырғи қабақ соғыстың аяқталуы", "ru": "перемены в отношениях Востока и Запада, конец холодной войны"}}], "answer": 1, "physicist": {"name": {"en": "Francis Crick", "kk": "Фрэнсис Крик", "ru": "Фрэнсис Крик"}, "cat": "Medicine", "year": 1962, "topic": {"en": "the molecular structure of DNA", "kk": "ДНҚ-ның молекулалық құрылымы", "ru": "молекулярная структура ДНК"}, "bg": {"en": "BSc in physics at University College London (1937). During WWII he designed magnetic and acoustic mines for the Admiralty. He switched to biology in 1947, aged 31, and completed a PhD on X-ray diffraction of proteins in Cambridge in 1954.", "kk": "Лондон университеттік колледжінде физика бакалавры (1937). Соғыс кезінде Адмиралтейство үшін магниттік және акустикалық миналарды жобалады. 1947 жылы, 31 жасында, биологияға ауысып, 1954 жылы Кембриджде ақуыздардың рентгендік дифракциясы бойынша диссертация қорғады.", "ru": "Бакалавр физики в Университетском колледже Лондона (1937). В войну проектировал магнитные и акустические мины для Адмиралтейства. В 1947 году, в 31 год, перешёл в биологию и в 1954 году защитил в Кембридже диссертацию по рентгеновской дифракции белков."}, "helped": {"en": "With Cochran and Vand he worked out the theory of X-ray diffraction by helical molecules (1951-52). That is why he could read the helix in Rosalind Franklin's diffraction photograph and, with Watson, build a model consistent with it.", "kk": "Кокран және Вандпен бірге ол спираль тәрізді молекулалардағы рентгендік дифракция теориясын жасады (1951–52). Сондықтан ол Розалинд Франклиннің дифракциялық суретінен спиральді көре алды және Уотсонмен бірге соған сәйкес модель құрды.", "ru": "Вместе с Кокраном и Вандом он разработал теорию рентгеновской дифракции на спиральных молекулах (1951–52). Поэтому он смог увидеть спираль в дифракционном снимке Розалинд Франклин и вместе с Уотсоном построить согласующуюся с ним модель."}}}, {"n": 2, "options": [{"name": {"en": "Barbara McClintock", "kk": "Барбара Мак-Клинток", "ru": "Барбара Мак-Клинток"}, "cat": "Medicine", "year": 1983, "topic": {"en": "mobile genetic elements ('jumping genes')", "kk": "жылжымалы генетикалық элементтер («секіргіш гендер»)", "ru": "мобильные генетические элементы («прыгающие гены»)"}}, {"name": {"en": "Barack Obama", "kk": "Барак Обама", "ru": "Барак Обама"}, "cat": "Peace", "year": 2009, "topic": {"en": "strengthening international diplomacy", "kk": "халықаралық дипломатияны нығайту", "ru": "укрепление международной дипломатии"}}, {"name": {"en": "John Goodenough", "kk": "Джон Гуденаф", "ru": "Джон Гуденаф"}, "cat": "Chemistry", "year": 2019, "topic": {"en": "development of lithium-ion batteries", "kk": "литий-ионды аккумуляторларды жасау", "ru": "создание литий-ионных аккумуляторов"}}], "answer": 2, "physicist": {"name": {"en": "John Goodenough", "kk": "Джон Гуденаф", "ru": "Джон Гуденаф"}, "cat": "Chemistry", "year": 2019, "topic": {"en": "development of lithium-ion batteries", "kk": "литий-ионды аккумуляторларды жасау", "ru": "создание литий-ионных аккумуляторов"}, "bg": {"en": "PhD in physics at Chicago (1952) under Clarence Zener. Solid-state physicist at MIT's Lincoln Laboratory, where he helped develop magnetic RAM, then professor at Oxford and Texas. Author of the Goodenough-Kanamori rules for magnetic superexchange.", "kk": "Чикагода Кларенс Зинердің жетекшілігімен физика бойынша докторлық (1952). MIT Линкольн зертханасында қатты дене физигі, онда магниттік жедел жадты жасауға қатысты, кейін Оксфорд пен Техаста профессор. Магниттік асқын алмасудың Гуденаф — Канамори ережелерінің авторы.", "ru": "Докторская по физике в Чикаго (1952) под руководством Кларенса Зинера. Физик твёрдого тела в Линкольновской лаборатории MIT, где участвовал в создании магнитной оперативной памяти, затем профессор в Оксфорде и Техасе. Автор правил Гуденафа — Канамори для магнитного сверхобмена."}, "helped": {"en": "His physics of electron states in transition-metal oxides told him which materials could hold lithium at high voltage. The lithium cobalt oxide cathode he found in 1980 doubled battery voltage and powers most phones today. At 97 he was the oldest Nobel laureate ever.", "kk": "Өтпелі металл оксидтеріндегі электрон күйлерінің физикасы оған қай материалдардың литийді жоғары кернеуде ұстай алатынын көрсетті. 1980 жылы тапқан литий-кобальт оксиді катоды батарея кернеуін екі есе арттырды және бүгінде телефондардың көпшілігін қуаттандырады. 97 жасында ол тарихтағы ең егде Нобель лауреаты болды.", "ru": "Физика электронных состояний в оксидах переходных металлов подсказала ему, какие материалы могут удерживать литий при высоком напряжении. Катод из оксида лития-кобальта, найденный им в 1980 году, удвоил напряжение батареи и сегодня питает большинство телефонов. В 97 лет он стал самым пожилым нобелевским лауреатом в истории."}}}, {"n": 3, "options": [{"name": {"en": "Frances Arnold", "kk": "Фрэнсис Арнольд", "ru": "Фрэнсис Арнольд"}, "cat": "Chemistry", "year": 2018, "topic": {"en": "directed evolution of enzymes", "kk": "ферменттердің бағытталған эволюциясы", "ru": "направленная эволюция ферментов"}}, {"name": {"en": "Katalin Karikó", "kk": "Каталин Карико", "ru": "Каталин Карико"}, "cat": "Medicine", "year": 2023, "topic": {"en": "mRNA modifications that enabled COVID-19 vaccines", "kk": "COVID-19 вакциналарына жол ашқан мРНҚ модификациялары", "ru": "модификации мРНК, сделавшие возможными вакцины от COVID-19"}}, {"name": {"en": "Stefan Hell", "kk": "Штефан Хелль", "ru": "Штефан Хелль"}, "cat": "Chemistry", "year": 2014, "topic": {"en": "super-resolved fluorescence microscopy (STED)", "kk": "аса жоғары ажыратымдылықтағы флуоресцентті микроскопия (STED)", "ru": "флуоресцентная микроскопия сверхвысокого разрешения (STED)"}}], "answer": 2, "physicist": {"name": {"en": "Stefan Hell", "kk": "Штефан Хелль", "ru": "Штефан Хелль"}, "cat": "Chemistry", "year": 2014, "topic": {"en": "super-resolved fluorescence microscopy (STED)", "kk": "аса жоғары ажыратымдылықтағы флуоресцентті микроскопия (STED)", "ru": "флуоресцентная микроскопия сверхвысокого разрешения (STED)"}, "bg": {"en": "PhD in physics at Heidelberg (1990). Worked out the STED principle at the University of Turku (1993-96). Director at the Max Planck Institute for Multidisciplinary Sciences (formerly Biophysical Chemistry) in Göttingen and the Max Planck Institute for Medical Research in Heidelberg.", "kk": "Гейдельбергте физика бойынша докторлық (1990). STED принципін Турку университетінде жасады (1993–96). Гёттингендегі Макс Планк қоғамының Мультидисциплинарлық ғылымдар институтының (бұрынғы Биофизикалық химия институты) және Гейдельбергтегі Медициналық зерттеулер институтының директоры.", "ru": "Докторская по физике в Гейдельберге (1990). Принцип STED разработал в Университете Турку (1993–96). Директор Института мультидисциплинарных наук Общества Макса Планка (бывший Институт биофизической химии) в Гёттингене и Института медицинских исследований в Гейдельберге."}, "helped": {"en": "He attacked Abbe's diffraction limit, a law of optics from 1873. In STED a second doughnut-shaped laser beam switches off fluorescence around the focal spot by stimulated emission, shrinking the effective spot far below the wavelength of light. Cells can now be imaged at the nanometre scale.", "kk": "Ол Аббенің дифракциялық шегіне — 1873 жылғы оптика заңына — қарсы шықты. STED әдісінде бублик пішінді екінші лазер сәулесі фокус айналасындағы флуоресценцияны мәжбүрлі сәулелену арқылы өшіріп, тиімді дақты жарық толқын ұзындығынан әлдеқайда кіші етеді. Енді жасушаларды нанометр масштабында көруге болады.", "ru": "Он бросил вызов дифракционному пределу Аббе — закону оптики 1873 года. В методе STED второй лазерный луч в форме бублика гасит флуоресценцию вокруг фокуса вынужденным излучением, сжимая эффективное пятно намного меньше длины волны света. Теперь клетки можно рассматривать в нанометровом масштабе."}}}, {"n": 4, "options": [{"name": {"en": "Peter Debye", "kk": "Петер Дебай", "ru": "Петер Дебай"}, "cat": "Chemistry", "year": 1936, "topic": {"en": "molecular structure via dipole moments and the diffraction of X-rays and electrons in gases", "kk": "диполь моменттері және газдардағы рентген сәулелері мен электрондардың дифракциясы арқылы молекула құрылымы", "ru": "строение молекул по дипольным моментам и дифракции рентгеновских лучей и электронов в газах"}}, {"name": {"en": "Martin Luther King Jr.", "kk": "Мартин Лютер Кинг", "ru": "Мартин Лютер Кинг"}, "cat": "Peace", "year": 1964, "topic": {"en": "nonviolent struggle for civil rights", "kk": "азаматтық құқықтар үшін күш қолданбай күрес", "ru": "ненасильственная борьба за гражданские права"}}, {"name": {"en": "Jennifer Doudna", "kk": "Дженнифер Даудна", "ru": "Дженнифер Даудна"}, "cat": "Chemistry", "year": 2020, "topic": {"en": "CRISPR-Cas9 genome editing", "kk": "CRISPR-Cas9 арқылы геномды өңдеу", "ru": "редактирование генома CRISPR-Cas9"}}], "answer": 0, "physicist": {"name": {"en": "Peter Debye", "kk": "Петер Дебай", "ru": "Петер Дебай"}, "cat": "Chemistry", "year": 1936, "topic": {"en": "molecular structure via dipole moments and the diffraction of X-rays and electrons in gases", "kk": "диполь моменттері және газдардағы рентген сәулелері мен электрондардың дифракциясы арқылы молекула құрылымы", "ru": "строение молекул по дипольным моментам и дифракции рентгеновских лучей и электронов в газах"}, "bg": {"en": "PhD in physics at Munich under Sommerfeld (1908). Succeeded Einstein at Zurich and held physics chairs at Utrecht, Göttingen, Zurich, Leipzig and Berlin. Known for the Debye model of specific heat and Debye-Hückel theory of electrolytes.", "kk": "Мюнхенде Зоммерфельдтің жетекшілігімен физика бойынша докторлық (1908). Цюрихте Эйнштейннің орнын басты, Утрехт, Гёттинген, Цюрих, Лейпциг және Берлинде физика кафедраларын басқарды. Жылу сыйымдылығының Дебай моделі және Дебай — Хюккель электролиттер теориясымен белгілі.", "ru": "Докторская по физике в Мюнхене под руководством Зоммерфельда (1908). Сменил Эйнштейна в Цюрихе, возглавлял кафедры физики в Утрехте, Гёттингене, Цюрихе, Лейпциге и Берлине. Известен моделью Дебая для теплоёмкости и теорией электролитов Дебая — Хюккеля."}, "helped": {"en": "He applied electrostatics and scattering theory to molecules, giving chemists quantitative ways to measure molecular polarity and geometry. The unit of electric dipole moment, the debye, carries his name.", "kk": "Ол электростатика мен шашырау теориясын молекулаларға қолданып, химиктерге молекулалардың полярлығы мен геометриясын сандық түрде өлшеу тәсілдерін берді. Электрлік диполь моментінің бірлігі — дебай — оның атымен аталады.", "ru": "Он применил электростатику и теорию рассеяния к молекулам, дав химикам количественные способы измерять полярность и геометрию молекул. Единица электрического дипольного момента — дебай — носит его имя."}}}, {"n": 5, "options": [{"name": {"en": "Georg von Békésy", "kk": "Дьёрдь Бекеши", "ru": "Дьёрдь Бекеши"}, "cat": "Medicine", "year": 1961, "topic": {"en": "the physical mechanism of stimulation within the cochlea", "kk": "ішкі құлақ ұлуындағы қозудың физикалық механизмі", "ru": "физический механизм возбуждения в улитке внутреннего уха"}}, {"name": {"en": "Elinor Ostrom", "kk": "Элинор Остром", "ru": "Элинор Остром"}, "cat": "Economics", "year": 2009, "topic": {"en": "governance of the commons; first woman Economics laureate", "kk": "ортақ ресурстарды басқару; экономика бойынша алғашқы әйел лауреат", "ru": "управление общими ресурсами; первая женщина-лауреат по экономике"}}, {"name": {"en": "Bob Dylan", "kk": "Боб Дилан", "ru": "Боб Дилан"}, "cat": "Literature", "year": 2016, "topic": {"en": "new poetic expressions within the song tradition", "kk": "ән дәстүріндегі жаңа поэтикалық бейнелер", "ru": "новые поэтические выражения в песенной традиции"}}], "answer": 0, "physicist": {"name": {"en": "Georg von Békésy", "kk": "Дьёрдь Бекеши", "ru": "Дьёрдь Бекеши"}, "cat": "Medicine", "year": 1961, "topic": {"en": "the physical mechanism of stimulation within the cochlea", "kk": "ішкі құлақ ұлуындағы қозудың физикалық механизмі", "ru": "физический механизм возбуждения в улитке внутреннего уха"}, "bg": {"en": "Studied chemistry in Bern and took a PhD in physics at the University of Budapest (1926). Worked at the Hungarian Post Office research laboratory on telephone signal quality (1923-46), then at Harvard (1947-66) and in Honolulu.", "kk": "Бернде химияны оқып, Будапешт университетінде физика бойынша докторлық алды (1926). Венгрия почтасының зерттеу зертханасында телефон сигналының сапасымен жұмыс істеді (1923–46), кейін Гарвардта (1947–66) және Гонолулуда.", "ru": "Изучал химию в Берне и получил докторскую по физике в Будапештском университете (1926). Работал в исследовательской лаборатории венгерской почты над качеством телефонного сигнала (1923–46), затем в Гарварде (1947–66) и в Гонолулу."}, "helped": {"en": "Improving telephones led him to ask how the ear itself works. Using strobe photography and silver flakes on cochleas, he showed that sound sets up a travelling wave along the basilar membrane whose peak position depends on frequency, so the ear sorts pitch mechanically before any nerve fires.", "kk": "Телефондарды жақсарта жүріп, ол құлақтың өзі қалай жұмыс істейтінін сұрады. Стробоскоптық түсірілім мен ұлудағы күміс қабыршақтардың көмегімен дыбыстың базилярлық мембрана бойымен жүгірме толқын тудыратынын, ал оның шыңының орны жиілікке байланысты екенін көрсетті — яғни құлақ дыбыс биіктігін нервтер қозғанға дейін механикалық түрде сұрыптайды.", "ru": "Улучшая телефоны, он задался вопросом, как работает само ухо. С помощью стробоскопической съёмки и серебряных чешуек на улитках он показал, что звук создаёт бегущую волну вдоль базилярной мембраны, положение максимума которой зависит от частоты, — то есть ухо сортирует высоту звука механически, ещё до срабатывания нервов."}}}, {"n": 6, "options": [{"name": {"en": "Gabriel García Márquez", "kk": "Габриэль Гарсиа Маркес", "ru": "Габриэль Гарсиа Маркес"}, "cat": "Literature", "year": 1982, "topic": {"en": "'One Hundred Years of Solitude'", "kk": "«Жүз жылдық жалғыздық»", "ru": "«Сто лет одиночества»"}}, {"name": {"en": "Alan Heeger", "kk": "Алан Хигер", "ru": "Алан Хигер"}, "cat": "Chemistry", "year": 2000, "topic": {"en": "discovery and development of electrically conductive polymers", "kk": "электр өткізгіш полимерлерді ашу және дамыту", "ru": "открытие и разработка электропроводящих полимеров"}}, {"name": {"en": "Frederick Sanger", "kk": "Фредерик Сенгер", "ru": "Фредерик Сенгер"}, "cat": "Chemistry", "year": 1958, "topic": {"en": "the structure of insulin", "kk": "инсулиннің құрылымы", "ru": "структура инсулина"}}], "answer": 1, "physicist": {"name": {"en": "Alan Heeger", "kk": "Алан Хигер", "ru": "Алан Хигер"}, "cat": "Chemistry", "year": 2000, "topic": {"en": "discovery and development of electrically conductive polymers", "kk": "электр өткізгіш полимерлерді ашу және дамыту", "ru": "открытие и разработка электропроводящих полимеров"}, "bg": {"en": "PhD in physics at Berkeley (1961). Condensed-matter physicist on the faculty of the University of Pennsylvania (1962-82), working on metals, magnetism and one-dimensional conductors.", "kk": "Берклиде физика бойынша докторлық (1961). Конденсацияланған күй физигі, Пенсильвания университетінде жұмыс істеді (1962–82), металдар, магнетизм және бірөлшемді өткізгіштермен айналысты.", "ru": "Докторская по физике в Беркли (1961). Физик конденсированного состояния, преподавал в Пенсильванском университете (1962–82), занимался металлами, магнетизмом и одномерными проводниками."}, "helped": {"en": "His understanding of charge transport, doping and solitons in one-dimensional systems explained how iodine-doped polyacetylene conducts like a metal. The work opened the way to organic LEDs and plastic solar cells.", "kk": "Бірөлшемді жүйелердегі заряд тасымалы, легирлеу және солитондар туралы түсінігі йодпен легирленген полиацетиленнің металл сияқты ток өткізетінін түсіндірді. Бұл жұмыс органикалық жарық диодтары мен пластик күн батареяларына жол ашты.", "ru": "Его понимание переноса заряда, легирования и солитонов в одномерных системах объяснило, почему полиацетилен, легированный иодом, проводит ток как металл. Работа открыла путь к органическим светодиодам и пластиковым солнечным батареям."}}}, {"n": 7, "options": [{"name": {"en": "Gerhard Herzberg", "kk": "Герхард Герцберг", "ru": "Герхард Герцберг"}, "cat": "Chemistry", "year": 1971, "topic": {"en": "electronic structure and geometry of molecules, especially free radicals", "kk": "молекулалардың, әсіресе бос радикалдардың электрондық құрылымы мен геометриясы", "ru": "электронная структура и геометрия молекул, особенно свободных радикалов"}}, {"name": {"en": "Desmond Tutu", "kk": "Десмонд Туту", "ru": "Десмонд Туту"}, "cat": "Peace", "year": 1984, "topic": {"en": "non-violent campaign against apartheid", "kk": "апартеидке қарсы күш қолданбайтын науқан", "ru": "ненасильственная кампания против апартеида"}}, {"name": {"en": "Ivan Bunin", "kk": "Иван Бунин", "ru": "Иван Бунин"}, "cat": "Literature", "year": 1933, "topic": {"en": "classical Russian prose; first Russian laureate", "kk": "классикалық орыс прозасы; алғашқы орыс лауреаты", "ru": "классическая русская проза; первый русский лауреат"}}], "answer": 0, "physicist": {"name": {"en": "Gerhard Herzberg", "kk": "Герхард Герцберг", "ru": "Герхард Герцберг"}, "cat": "Chemistry", "year": 1971, "topic": {"en": "electronic structure and geometry of molecules, especially free radicals", "kk": "молекулалардың, әсіресе бос радикалдардың электрондық құрылымы мен геометриясы", "ru": "электронная структура и геометрия молекул, особенно свободных радикалов"}, "bg": {"en": "Dr.-Ing. in physics at Darmstadt University of Technology (1928), postdoctoral work with James Franck and Max Born in Göttingen. Left Nazi Germany in 1935 for the University of Saskatchewan and later the National Research Council of Canada.", "kk": "Дармштадт техникалық университетінде физика бойынша доктор-инженер (1928), Гёттингенде Джеймс Франк пен Макс Борнның қасында постдок. 1935 жылы нацистік Германиядан кетіп, Саскачеван университетіне, кейін Канада Ұлттық зерттеу кеңесіне барды.", "ru": "Доктор-инженер по физике в Дармштадтском техническом университете (1928), постдок у Джеймса Франка и Макса Борна в Гёттингене. В 1935 году покинул нацистскую Германию ради Университета Саскачевана, позже — Национального исследовательского совета Канады."}, "helped": {"en": "Molecular spectroscopy is physics applied to chemistry: from the light that molecules absorb and emit he worked out their structure and geometry, including short-lived free radicals that cannot be studied any other way, and identified molecules in comets and interstellar space from their spectra.", "kk": "Молекулалық спектроскопия — химияға қолданылған физика: молекулалардың жұтатын және шығаратын жарығы арқылы ол олардың құрылымы мен геометриясын, соның ішінде басқа әдіспен зерттеуге келмейтін қысқа өмірлі бос радикалдарды анықтады және кометалар мен жұлдызаралық кеңістіктегі молекулаларды спектрлері арқылы таныды.", "ru": "Молекулярная спектроскопия — это физика, применённая к химии: по свету, который молекулы поглощают и излучают, он определял их строение и геометрию, включая короткоживущие свободные радикалы, недоступные другим методам, и опознавал молекулы в кометах и межзвёздном пространстве по их спектрам."}}}, {"n": 8, "options": [{"name": {"en": "Ben Feringa", "kk": "Бен Феринга", "ru": "Бен Феринга"}, "cat": "Chemistry", "year": 2016, "topic": {"en": "design and synthesis of molecular machines", "kk": "молекулалық машиналарды жобалау және синтездеу", "ru": "создание и синтез молекулярных машин"}}, {"name": {"en": "Aaron Klug", "kk": "Аарон Клуг", "ru": "Аарон Клуг"}, "cat": "Chemistry", "year": 1982, "topic": {"en": "crystallographic electron microscopy and structures of nucleic acid-protein complexes", "kk": "кристаллографиялық электронды микроскопия және нуклеин қышқылы-ақуыз кешендерінің құрылымы", "ru": "кристаллографическая электронная микроскопия и структуры комплексов нуклеиновых кислот с белками"}}, {"name": {"en": "Linus Pauling", "kk": "Лайнус Полинг", "ru": "Лайнус Полинг"}, "cat": "Chemistry", "year": 1954, "topic": {"en": "the nature of the chemical bond", "kk": "химиялық байланыстың табиғаты", "ru": "природа химической связи"}}], "answer": 1, "physicist": {"name": {"en": "Aaron Klug", "kk": "Аарон Клуг", "ru": "Аарон Клуг"}, "cat": "Chemistry", "year": 1982, "topic": {"en": "crystallographic electron microscopy and structures of nucleic acid-protein complexes", "kk": "кристаллографиялық электронды микроскопия және нуклеин қышқылы-ақуыз кешендерінің құрылымы", "ru": "кристаллографическая электронная микроскопия и структуры комплексов нуклеиновых кислот с белками"}, "bg": {"en": "BSc in physics and mathematics at Witwatersrand, MSc at Cape Town, PhD in physics at Trinity College, Cambridge (1953) on phase changes in steel. Later director of the MRC Laboratory of Molecular Biology (1986-96) and President of the Royal Society (1995-2000).", "kk": "Витватерсрандта физика және математика бакалавры, Кейптаунда магистр, Кембридждегі Тринити-колледжде болаттағы фазалық түрленулер туралы физика бойынша докторлық (1953). Кейін MRC Молекулалық биология зертханасының директоры (1986–96) және Лондон корольдік қоғамының президенті (1995–2000).", "ru": "Бакалавр физики и математики в Витватерсранде, магистр в Кейптауне, докторская по физике в Тринити-колледже Кембриджа (1953) о фазовых превращениях в стали. Позже директор Лаборатории молекулярной биологии MRC (1986–96) и президент Лондонского королевского общества (1995–2000)."}, "helped": {"en": "Rosalind Franklin introduced him to X-ray studies of tobacco mosaic virus at Birkbeck, where he extended Cochran and Crick's theory of diffraction by helices. Combining electron micrographs taken from different angles with Fourier methods, he created three-dimensional reconstruction, the basis of today's cryo-electron microscopy.", "kk": "Розалинд Франклин оны Биркбекте темекі мозаикасы вирусын рентгенмен зерттеуге тартты, онда ол Кокран мен Криктің спиральдардағы дифракция теориясын дамытты. Әртүрлі бұрыштан түсірілген электронды микрофотографияларды Фурье әдістерімен біріктіріп, ол үшөлшемді реконструкцияны — қазіргі криоэлектронды микроскопияның негізін — жасады.", "ru": "Розалинд Франклин ввела его в рентгеновские исследования вируса табачной мозаики в Биркбеке, где он развил теорию Кокрана и Крика о дифракции на спиралях. Сочетая электронные микрофотографии под разными углами с методами Фурье, он создал трёхмерную реконструкцию — основу современной криоэлектронной микроскопии."}}}, {"n": 9, "options": [{"name": {"en": "Orhan Pamuk", "kk": "Орхан Памук", "ru": "Орхан Памук"}, "cat": "Literature", "year": 2006, "topic": {"en": "'My Name Is Red', 'Snow'; the soul of Istanbul", "kk": "«Менің атым — Қырмызы», «Қар»; Стамбулдың жаны", "ru": "«Меня зовут Красный», «Снег»; душа Стамбула"}}, {"name": {"en": "Tjalling Koopmans", "kk": "Тьяллинг Купманс", "ru": "Тьяллинг Купманс"}, "cat": "Economics", "year": 1975, "topic": {"en": "the theory of optimum allocation of resources", "kk": "ресурстарды оңтайлы бөлу теориясы", "ru": "теория оптимального распределения ресурсов"}}, {"name": {"en": "Pablo Neruda", "kk": "Пабло Неруда", "ru": "Пабло Неруда"}, "cat": "Literature", "year": 1971, "topic": {"en": "poetry of a continent's destiny; 'Twenty Love Poems'", "kk": "құрлық тағдырының поэзиясы; «Махаббат туралы жиырма өлең»", "ru": "поэзия судьбы континента; «Двадцать стихотворений о любви»"}}], "answer": 1, "physicist": {"name": {"en": "Tjalling Koopmans", "kk": "Тьяллинг Купманс", "ru": "Тьяллинг Купманс"}, "cat": "Economics", "year": 1975, "topic": {"en": "the theory of optimum allocation of resources", "kk": "ресурстарды оңтайлы бөлу теориясы", "ru": "теория оптимального распределения ресурсов"}, "bg": {"en": "Began in mathematics at Utrecht, switched to theoretical physics in 1930 and worked on Hartree-Fock theory; Koopmans' theorem in quantum chemistry carries his name. Met Jan Tinbergen in 1933 and turned to economics; PhD at Leiden (1936) under the physicist Hendrik Kramers.", "kk": "Утрехтте математикадан бастап, 1930 жылы теориялық физикаға ауысып, Хартри — Фок теориясымен жұмыс істеді; кванттық химиядағы Купманс теоремасы оның атымен аталады. 1933 жылы Ян Тинбергенмен кездесіп, экономикаға бет бұрды; Лейденде физик Хендрик Крамерстің жетекшілігімен докторлық (1936).", "ru": "Начал с математики в Утрехте, в 1930 году перешёл в теоретическую физику и работал над теорией Хартри — Фока; теорема Купманса в квантовой химии носит его имя. В 1933 году встретил Яна Тинбергена и обратился к экономике; докторская в Лейдене (1936) у физика Хендрика Крамерса."}, "helped": {"en": "He treated an economy the way a physicist treats a system with constraints: activity analysis and linear programming find the mix of inputs and outputs that is most efficient, with prices appearing as the multipliers. He directed the Cowles Commission and moved it to Yale.", "kk": "Экономикаға ол физиктің байланыстары бар жүйеге қарайтынындай қарады: қызмет талдауы мен сызықтық бағдарламалау шығын мен өнімнің ең тиімді қатынасын табады, ал бағалар көбейткіштер ретінде пайда болады. Коулз комиссиясын басқарып, оны Йельге көшірді.", "ru": "К экономике он подошёл так, как физик подходит к системе со связями: анализ деятельности и линейное программирование находят самое эффективное сочетание затрат и выпуска, а цены возникают как множители. Он возглавлял Комиссию Коулза и перевёл её в Йель."}}}, {"n": 10, "options": [{"name": {"en": "Robert Koch", "kk": "Роберт Кох", "ru": "Роберт Кох"}, "cat": "Medicine", "year": 1905, "topic": {"en": "discovery of the tuberculosis bacterium", "kk": "туберкулез қоздырғышының ашылуы", "ru": "открытие возбудителя туберкулёза"}}, {"name": {"en": "Nelson Mandela", "kk": "Нельсон Мандела", "ru": "Нельсон Мандела"}, "cat": "Peace", "year": 1993, "topic": {"en": "peaceful end of apartheid", "kk": "апартеидтің бейбіт жолмен аяқталуы", "ru": "мирное окончание апартеида"}}, {"name": {"en": "Walter Kohn", "kk": "Уолтер Кон", "ru": "Уолтер Кон"}, "cat": "Chemistry", "year": 1998, "topic": {"en": "development of density-functional theory (DFT)", "kk": "тығыздық функционалы теориясын (DFT) жасау", "ru": "создание теории функционала плотности (DFT)"}}], "answer": 2, "physicist": {"name": {"en": "Walter Kohn", "kk": "Уолтер Кон", "ru": "Уолтер Кон"}, "cat": "Chemistry", "year": 1998, "topic": {"en": "development of density-functional theory (DFT)", "kk": "тығыздық функционалы теориясын (DFT) жасау", "ru": "создание теории функционала плотности (DFT)"}, "bg": {"en": "PhD in physics at Harvard (1948) under Julian Schwinger. A solid-state theorist (Kohn anomaly, Luttinger-Kohn model) and founding director of the Institute for Theoretical Physics at Santa Barbara.", "kk": "Гарвардта Джулиан Швингердің жетекшілігімен физика бойынша докторлық (1948). Қатты дене теоретигі (Кон аномалиясы, Латтинжер — Кон моделі), Санта-Барбарадағы Теориялық физика институтының тұңғыш директоры.", "ru": "Докторская по физике в Гарварде (1948) под руководством Джулиана Швингера. Теоретик твёрдого тела (аномалия Кона, модель Латтинжера — Кона), первый директор Института теоретической физики в Санта-Барбаре."}, "helped": {"en": "DFT grew out of the physics of the electron gas in metals. Kohn showed that the ground-state energy of any system of electrons is a functional of the electron density alone (1964-65), turning an impossible many-body problem into a tractable one. Today DFT is the workhorse of computational chemistry and materials science.", "kk": "Тығыздық функционалы теориясы металдардағы электрон газының физикасынан өсіп шықты. Кон кез келген электрондар жүйесінің негізгі күй энергиясы тек электрон тығыздығының функционалы екенін көрсетіп (1964–65), шешілмейтін көп дене есебін шешілетін есепке айналдырды. Бүгінде DFT — есептеу химиясы мен материалтанудың негізгі құралы.", "ru": "Теория функционала плотности выросла из физики электронного газа в металлах. Кон показал, что энергия основного состояния любой системы электронов — функционал одной лишь электронной плотности (1964–65), превратив неразрешимую задачу многих тел в решаемую. Сегодня DFT — рабочая лошадка вычислительной химии и материаловедения."}}}, {"n": 11, "options": [{"name": {"en": "Alexander Fleming", "kk": "Александр Флеминг", "ru": "Александр Флеминг"}, "cat": "Medicine", "year": 1945, "topic": {"en": "discovery of penicillin", "kk": "пенициллиннің ашылуы", "ru": "открытие пенициллина"}}, {"name": {"en": "Henry Dunant", "kk": "Анри Дюнан", "ru": "Анри Дюнан"}, "cat": "Peace", "year": 1901, "topic": {"en": "founder of the Red Cross; first Peace laureate", "kk": "Қызыл Крестің негізін қалаушы; бейбітшілік сыйлығының алғашқы лауреаты", "ru": "основатель Красного Креста; первый лауреат премии мира"}}, {"name": {"en": "Joseph Rotblat", "kk": "Джозеф Ротблат", "ru": "Джозеф Ротблат"}, "cat": "Peace", "year": 1995, "topic": {"en": "efforts to diminish the role of nuclear arms (with the Pugwash Conferences)", "kk": "ядролық қарудың рөлін азайту жолындағы күш-жігер (Пагуош конференцияларымен бірге)", "ru": "усилия по уменьшению роли ядерного оружия (вместе с Пагуошским движением)"}}], "answer": 2, "physicist": {"name": {"en": "Joseph Rotblat", "kk": "Джозеф Ротблат", "ru": "Джозеф Ротблат"}, "cat": "Peace", "year": 1995, "topic": {"en": "efforts to diminish the role of nuclear arms (with the Pugwash Conferences)", "kk": "ядролық қарудың рөлін азайту жолындағы күш-жігер (Пагуош конференцияларымен бірге)", "ru": "усилия по уменьшению роли ядерного оружия (вместе с Пагуошским движением)"}, "bg": {"en": "Nuclear physicist, doctorate from the University of Warsaw (1938). Worked with James Chadwick in Liverpool, joined the Manhattan Project and left Los Alamos on grounds of conscience in 1944. From 1949 professor of physics at St Bartholomew's Hospital medical college in London, studying the effects of radiation on living organisms.", "kk": "Ядролық физик, Варшава университетінде докторлық (1938). Ливерпульде Джеймс Чедвикпен жұмыс істеді, Манхэттен жобасына қатысты және 1944 жылы ар-ұждан себебімен Лос-Аламостан кетті. 1949 жылдан Лондондағы Әулие Варфоломей ауруханасының медициналық колледжінде физика профессоры, радиацияның тірі организмдерге әсерін зерттеді.", "ru": "Физик-ядерщик, докторская в Варшавском университете (1938). Работал с Джеймсом Чедвиком в Ливерпуле, участвовал в Манхэттенском проекте и в 1944 году покинул Лос-Аламос по соображениям совести. С 1949 года профессор физики в медицинском колледже больницы Св. Варфоломея в Лондоне, изучал действие радиации на живые организмы."}, "helped": {"en": "He knew exactly what nuclear weapons do. In 1955 he showed that fallout from the 1954 Castle Bravo test at Bikini Atoll was far greater than officially stated, work that helped bring about the 1963 Partial Test Ban Treaty. He signed the Russell-Einstein Manifesto (1955) and was secretary-general of Pugwash from its founding until 1973, later its president.", "kk": "Ол ядролық қарудың не істейтінін жақсы білді. 1955 жылы Бикини атолындағы 1954 жылғы «Касл Браво» сынағының радиоактивті түсуі ресми айтылғаннан әлдеқайда көп екенін көрсетті — бұл 1963 жылғы Ядролық сынақтарға ішінара тыйым салу шартын жасауға көмектесті. Рассел — Эйнштейн манифестіне қол қойды (1955), Пагуош қозғалысының құрылғанынан 1973 жылға дейін бас хатшысы, кейін президенті болды.", "ru": "Он точно знал, что делает ядерное оружие. В 1955 году показал, что радиоактивные осадки от испытания «Касл Браво» 1954 года на атолле Бикини были куда больше официальных данных, — это помогло заключить Договор о запрещении ядерных испытаний 1963 года. Подписал манифест Рассела — Эйнштейна (1955), был генеральным секретарём Пагуошского движения с его основания до 1973 года, позже — президентом."}}}, {"n": 12, "options": [{"name": {"en": "Marie Curie", "kk": "Мария Кюри", "ru": "Мария Кюри"}, "cat": "Chemistry", "year": 1911, "topic": {"en": "discovery of radium and polonium and the isolation of pure radium", "kk": "радий мен полонийдің ашылуы және таза радийдің бөлініп алынуы", "ru": "открытие радия и полония и выделение чистого радия"}}, {"name": {"en": "Tu Youyou", "kk": "Ту Юю", "ru": "Ту Юю"}, "cat": "Medicine", "year": 2015, "topic": {"en": "artemisinin therapy against malaria", "kk": "безгекке қарсы артемизинин", "ru": "артемизинин против малярии"}}, {"name": {"en": "Rita Levi-Montalcini", "kk": "Рита Леви-Монтальчини", "ru": "Рита Леви-Монтальчини"}, "cat": "Medicine", "year": 1986, "topic": {"en": "discovery of nerve growth factor", "kk": "нерв өсу факторының ашылуы", "ru": "открытие фактора роста нервов"}}], "answer": 0, "physicist": {"name": {"en": "Marie Curie", "kk": "Мария Кюри", "ru": "Мария Кюри"}, "cat": "Chemistry", "year": 1911, "topic": {"en": "discovery of radium and polonium and the isolation of pure radium", "kk": "радий мен полонийдің ашылуы және таза радийдің бөлініп алынуы", "ru": "открытие радия и полония и выделение чистого радия"}, "bg": {"en": "Licence in physics at the Sorbonne (1893), Nobel Prize in Physics 1903 for research on radioactivity, and the first woman professor of physics at the Sorbonne. The only person with Nobel Prizes in two different sciences.", "kk": "Сорбоннада физика бойынша диплом (1893), радиоактивтілікті зерттегені үшін 1903 жылғы физика бойынша Нобель сыйлығы, Сорбоннаның алғашқы әйел профессоры. Екі түрлі ғылым бойынша Нобель сыйлығын алған жалғыз адам.", "ru": "Диплом по физике в Сорбонне (1893), Нобелевская премия по физике 1903 года за исследования радиоактивности, первая женщина-профессор Сорбонны. Единственный человек с Нобелевскими премиями в двух разных науках."}, "helped": {"en": "Her key tool was a piezoelectric quartz electrometer built by Pierre and Jacques Curie. Measuring tiny ionisation currents told her radioactivity was a property of atoms, not of compounds, and that pitchblende contained something far more active than uranium. That measurement guided years of chemical separation of tonnes of ore.", "kk": "Оның басты құралы — Пьер мен Жак Кюри жасаған пьезоэлектрлік кварц электрометрі. Өте әлсіз иондану тогын өлшей отырып, ол радиоактивтіліктің қосылыстың емес, атомның қасиеті екенін және уран кенінде уранның өзінен әлдеқайда белсенді нәрсе бар екенін түсінді. Осы өлшеу тонналаған кенді жылдар бойы химиялық жолмен бөлу жұмысына бағыт берді.", "ru": "Её главным инструментом был пьезоэлектрический кварцевый электрометр, построенный Пьером и Жаком Кюри. Измеряя ничтожные токи ионизации, она поняла, что радиоактивность — свойство атомов, а не соединений, и что урановая руда содержит нечто гораздо активнее урана. Это измерение направляло годы химического разделения тонн руды."}}}, {"n": 13, "options": [{"name": {"en": "Esther Duflo", "kk": "Эстер Дюфло", "ru": "Эстер Дюфло"}, "cat": "Economics", "year": 2019, "topic": {"en": "experimental approach to alleviating global poverty", "kk": "жаһандық кедейлікпен күрестің эксперименттік тәсілі", "ru": "экспериментальный подход к борьбе с глобальной бедностью"}}, {"name": {"en": "Muhammad Yunus", "kk": "Мухаммад Юнус", "ru": "Мухаммад Юнус"}, "cat": "Peace", "year": 2006, "topic": {"en": "microcredit and the Grameen Bank", "kk": "микронесие және «Грамин» банкі", "ru": "микрокредит и банк «Грамин»"}}, {"name": {"en": "Alexei Ekimov", "kk": "Алексей Екимов", "ru": "Алексей Екимов"}, "cat": "Chemistry", "year": 2023, "topic": {"en": "discovery and synthesis of quantum dots", "kk": "кванттық нүктелерді ашу және синтездеу", "ru": "открытие и синтез квантовых точек"}}], "answer": 2, "physicist": {"name": {"en": "Alexei Ekimov", "kk": "Алексей Екимов", "ru": "Алексей Екимов"}, "cat": "Chemistry", "year": 2023, "topic": {"en": "discovery and synthesis of quantum dots", "kk": "кванттық нүктелерді ашу және синтездеу", "ru": "открытие и синтез квантовых точек"}, "bg": {"en": "Studied physics at Leningrad State University, PhD at the Ioffe Physical-Technical Institute, then researcher at the Vavilov State Optical Institute in the USSR.", "kk": "Ленинград мемлекеттік университетінің физика факультетінде оқыды, Иоффе атындағы Физика-техникалық институтында кандидаттық қорғады, кейін Вавилов атындағы Мемлекеттік оптика институтында ғылыми қызметкер болды.", "ru": "Учился на физическом факультете Ленинградского университета, кандидатская в Физико-техническом институте им. Иоффе, затем научный сотрудник Государственного оптического института им. Вавилова."}, "helped": {"en": "In 1981 he saw that the colour of copper chloride nanocrystals grown in glass depended only on their size. He explained it with quantum confinement, the 'particle in a box' of elementary quantum mechanics. Quantum dots now colour QLED screens and label cells in biology.", "kk": "1981 жылы ол шыныда өсірілген мыс хлориді нанокристалдарының түсі тек олардың өлшеміне байланысты екенін байқады. Ол мұны кванттық шектеумен — қарапайым кванттық механикадағы «қораптағы бөлшекпен» — түсіндірді. Бүгінде кванттық нүктелер QLED экрандарын түрлендіреді және биологияда жасушаларды таңбалайды.", "ru": "В 1981 году он заметил, что цвет нанокристаллов хлорида меди, выращенных в стекле, зависит только от их размера. Он объяснил это квантовым ограничением — «частицей в ящике» из элементарной квантовой механики. Сегодня квантовые точки окрашивают экраны QLED и метят клетки в биологии."}}}, {"n": 14, "options": [{"name": {"en": "Olga Tokarczuk", "kk": "Ольга Токарчук", "ru": "Ольга Токарчук"}, "cat": "Literature", "year": 2018, "topic": {"en": "'Flights'; narrative imagination crossing boundaries", "kk": "«Қашқындар»; шекараларды кесіп өтетін баяндау қиялы", "ru": "«Бегуны»; нарративное воображение, пересекающее границы"}}, {"name": {"en": "Ernest Rutherford", "kk": "Эрнест Резерфорд", "ru": "Эрнест Резерфорд"}, "cat": "Chemistry", "year": 1908, "topic": {"en": "disintegration of the elements and the chemistry of radioactive substances", "kk": "элементтердің ыдырауы және радиоактивті заттардың химиясы", "ru": "распад элементов и химия радиоактивных веществ"}}, {"name": {"en": "Claudia Goldin", "kk": "Клаудия Голдин", "ru": "Клаудия Голдин"}, "cat": "Economics", "year": 2023, "topic": {"en": "women's outcomes in the labour market", "kk": "әйелдердің еңбек нарығындағы жағдайы", "ru": "положение женщин на рынке труда"}}], "answer": 1, "physicist": {"name": {"en": "Ernest Rutherford", "kk": "Эрнест Резерфорд", "ru": "Эрнест Резерфорд"}, "cat": "Chemistry", "year": 1908, "topic": {"en": "disintegration of the elements and the chemistry of radioactive substances", "kk": "элементтердің ыдырауы және радиоактивті заттардың химиясы", "ru": "распад элементов и химия радиоактивных веществ"}, "bg": {"en": "Professor of physics at McGill, Manchester and finally director of the Cavendish Laboratory. Discovered alpha and beta rays, the atomic nucleus (1911) and the first artificial nuclear reaction (1919).", "kk": "Макгилл мен Манчестерде физика профессоры, кейін Кембридждегі Кавендиш зертханасының директоры. Альфа және бета сәулелерін, атом ядросын (1911) ашты және алғашқы жасанды ядролық реакцияны жүргізді (1919).", "ru": "Профессор физики в Макгилле и Манчестере, затем директор Кавендишской лаборатории в Кембридже. Открыл альфа- и бета-лучи, атомное ядро (1911) и провёл первую искусственную ядерную реакцию (1919)."}, "helped": {"en": "He proved that radioactive elements transmute into other elements not by chemical analysis but by physical measurement: ionisation currents, half-lives and the deflection of rays in electric and magnetic fields. He reportedly joked at the Nobel banquet that the fastest transformation he had ever observed was his own, from physicist to chemist.", "kk": "Ол радиоактивті элементтердің басқа элементтерге айналатынын химиялық талдаумен емес, физикалық өлшеулермен дәлелдеді: иондану тогы, жартылай ыдырау периоды және сәулелердің электр және магнит өрістерінде ауытқуы арқылы. Айтуынша, Нобель банкетінде ол өзі көрген ең жылдам түрлену — өзінің физиктен химикке айналуы деп әзілдеген.", "ru": "Он доказал, что радиоактивные элементы превращаются в другие элементы, не химическим анализом, а физическими измерениями: токами ионизации, периодами полураспада и отклонением лучей в электрическом и магнитном полях. По рассказам, на нобелевском банкете он пошутил, что самое быстрое превращение, какое он видел, — его собственное: из физика в химика."}}}, {"n": 15, "options": [{"name": {"en": "Shinya Yamanaka", "kk": "Синъя Яманака", "ru": "Синъя Яманака"}, "cat": "Medicine", "year": 2012, "topic": {"en": "reprogramming mature cells into stem cells", "kk": "жетілген жасушаларды дің жасушаларына қайта бағдарламалау", "ru": "перепрограммирование зрелых клеток в стволовые"}}, {"name": {"en": "Gerhard Ertl", "kk": "Герхард Эртль", "ru": "Герхард Эртль"}, "cat": "Chemistry", "year": 2007, "topic": {"en": "chemical processes on solid surfaces", "kk": "қатты беттердегі химиялық процестер", "ru": "химические процессы на твёрдых поверхностях"}}, {"name": {"en": "Otto Hahn", "kk": "Отто Ган", "ru": "Отто Ган"}, "cat": "Chemistry", "year": 1944, "topic": {"en": "discovery of nuclear fission", "kk": "ядролардың бөлінуін ашу", "ru": "открытие деления ядер"}}], "answer": 1, "physicist": {"name": {"en": "Gerhard Ertl", "kk": "Герхард Эртль", "ru": "Герхард Эртль"}, "cat": "Chemistry", "year": 2007, "topic": {"en": "chemical processes on solid surfaces", "kk": "қатты беттердегі химиялық процестер", "ru": "химические процессы на твёрдых поверхностях"}, "bg": {"en": "Diploma in physics at the Technische Hochschule Stuttgart (1961), PhD at the Technische Hochschule München (1965) under Heinz Gerischer. Later director at the Fritz Haber Institute of the Max Planck Society in Berlin.", "kk": "Штутгарт жоғары техникалық мектебінде физика дипломы (1961), Мюнхен жоғары техникалық мектебінде Хайнц Геришердің жетекшілігімен докторлық (1965). Кейін Берлиндегі Макс Планк қоғамының Фриц Габер институтының директоры.", "ru": "Диплом физика в Штутгартской высшей технической школе (1961), докторская в Мюнхенской высшей технической школе (1965) у Хайнца Геришера. Позже директор Института Фрица Габера Общества Макса Планка в Берлине."}, "helped": {"en": "He brought the vacuum and electron techniques of surface physics into chemistry and showed step by step how reactions happen on metal surfaces, including the ammonia synthesis that feeds the world and the catalytic converter that cleans car exhaust.", "kk": "Ол бет физикасының вакуумдық және электрондық әдістерін химияға енгізіп, металл беттерінде реакциялардың қалай жүретінін қадам-қадам көрсетті — соның ішінде әлемді асырайтын аммиак синтезін және автокөлік түтінін тазартатын каталитикалық бейтараптандырғышты.", "ru": "Он принёс в химию вакуумные и электронные методы физики поверхности и шаг за шагом показал, как идут реакции на поверхности металлов, — включая синтез аммиака, кормящий мир, и каталитический нейтрализатор, очищающий выхлоп автомобилей."}}}, {"n": 16, "options": [{"name": {"en": "Allan Cormack", "kk": "Аллан Кормак", "ru": "Аллан Кормак"}, "cat": "Medicine", "year": 1979, "topic": {"en": "development of computer-assisted tomography (CT scanning)", "kk": "компьютерлік томографияны (КТ) жасау", "ru": "разработка компьютерной томографии (КТ)"}}, {"name": {"en": "Svetlana Alexievich", "kk": "Светлана Алексиевич", "ru": "Светлана Алексиевич"}, "cat": "Literature", "year": 2015, "topic": {"en": "'Chernobyl Prayer'; polyphonic documentary prose", "kk": "«Чернобыль дұғасы»; көпдауысты деректі проза", "ru": "«Чернобыльская молитва»; многоголосая документальная проза"}}, {"name": {"en": "Wangari Maathai", "kk": "Вангари Маатаи", "ru": "Вангари Маатаи"}, "cat": "Peace", "year": 2004, "topic": {"en": "Green Belt Movement, sustainable development", "kk": "«Жасыл белдеу» қозғалысы, тұрақты даму", "ru": "движение «Зелёный пояс», устойчивое развитие"}}], "answer": 0, "physicist": {"name": {"en": "Allan Cormack", "kk": "Аллан Кормак", "ru": "Аллан Кормак"}, "cat": "Medicine", "year": 1979, "topic": {"en": "development of computer-assisted tomography (CT scanning)", "kk": "компьютерлік томографияны (КТ) жасау", "ru": "разработка компьютерной томографии (КТ)"}, "bg": {"en": "BSc in physics (1944) and MSc in crystallography (1945) at Cape Town, doctoral research at Cambridge (1947-49) without ever taking a doctorate, then professor of physics at Tufts University. A particle physicist by trade.", "kk": "Кейптаунда физика бакалавры (1944) және кристаллография магистрі (1945), Кембриджде докторлық зерттеулер (1947–49), бірақ диссертация қорғамады, кейін Тафтс университетінде физика профессоры. Мамандығы бойынша — бөлшектер физигі.", "ru": "Бакалавр физики (1944) и магистр кристаллографии (1945) в Кейптауне, исследования в Кембридже (1947–49) без защиты диссертации, затем профессор физики в Университете Тафтса. По специальности — физик элементарных частиц."}, "helped": {"en": "In 1956, working part-time as a hospital physicist, he worked out the mathematics of reconstructing a 2-D map of X-ray absorption from measurements along lines (rediscovering the Radon transform). Published in the Journal of Applied Physics in 1963-64 and largely ignored until Hounsfield built the first scanner in 1971.", "kk": "1956 жылы ауруханада физик болып қосымша жұмыс істей жүріп, ол түзулер бойындағы өлшеулерден рентген сәулесі жұтылуының екіөлшемді картасын қалпына келтіру математикасын шығарды (Радон түрлендіруін қайта ашты). 1963–64 жылдары Journal of Applied Physics журналында жарияланып, Хаунсфилд 1971 жылы алғашқы томографты жасағанша елеусіз қалды.", "ru": "В 1956 году, подрабатывая физиком в больнице, он вывел математику восстановления двумерной карты поглощения рентгеновских лучей по измерениям вдоль прямых (заново открыв преобразование Радона). Опубликовано в Journal of Applied Physics в 1963–64 годах и почти не замечено, пока Хаунсфилд не построил первый томограф в 1971 году."}}}, {"n": 17, "options": [{"name": {"en": "Han Kang", "kk": "Хан Ган", "ru": "Хан Ган"}, "cat": "Literature", "year": 2024, "topic": {"en": "'The Vegetarian'; intense poetic prose", "kk": "«Вегетариан»; қуатты поэтикалық проза", "ru": "«Вегетарианка»; напряжённая поэтическая проза"}}, {"name": {"en": "Peter Mansfield", "kk": "Питер Мэнсфилд", "ru": "Питер Мэнсфилд"}, "cat": "Medicine", "year": 2003, "topic": {"en": "discoveries concerning magnetic resonance imaging (MRI)", "kk": "магниттік-резонанстық томография (МРТ) саласындағы жаңалықтар", "ru": "открытия в области магнитно-резонансной томографии (МРТ)"}}, {"name": {"en": "May-Britt Moser", "kk": "Мэй-Бритт Мозер", "ru": "Мэй-Бритт Мозер"}, "cat": "Medicine", "year": 2014, "topic": {"en": "grid cells, the brain's positioning system", "kk": "грид-нейрондар, мидың орналасуды анықтау жүйесі", "ru": "грид-нейроны, система позиционирования мозга"}}], "answer": 1, "physicist": {"name": {"en": "Peter Mansfield", "kk": "Питер Мэнсфилд", "ru": "Питер Мэнсфилд"}, "cat": "Medicine", "year": 2003, "topic": {"en": "discoveries concerning magnetic resonance imaging (MRI)", "kk": "магниттік-резонанстық томография (МРТ) саласындағы жаңалықтар", "ru": "открытия в области магнитно-резонансной томографии (МРТ)"}, "bg": {"en": "Left school at 15, worked on rocket propulsion, then earned a BSc and PhD in physics at Queen Mary, London (1962) on nuclear magnetic resonance. Professor of physics at Nottingham.", "kk": "15 жасында мектепті тастап, зымыран қозғалтқыштарымен айналысты, кейін Лондондағы Куин Мэри колледжінде ядролық магниттік резонанс бойынша физика бакалавры мен докторлық (1962) алды. Ноттингемде физика профессоры.", "ru": "Бросил школу в 15 лет, работал в ракетной технике, затем получил бакалавра и докторскую по физике в колледже Куин Мэри в Лондоне (1962) по ядерному магнитному резонансу. Профессор физики в Ноттингеме."}, "helped": {"en": "He showed how magnetic field gradients can be analysed mathematically to turn NMR signals into images quickly (echo-planar imaging), which made MRI practical. He tested the first whole-body scanner on himself.", "kk": "Ол магнит өрісінің градиенттерін математикалық талдап, ЯМР сигналдарын тез арада кескінге айналдыруға болатынын көрсетті (эхо-планарлық томография), бұл МРТ-ны іс жүзінде қолданылатын етті. Алғашқы толық дене сканерін өзінде сынап көрді.", "ru": "Он показал, как математически анализировать градиенты магнитного поля, чтобы быстро превращать сигналы ЯМР в изображения (эхо-планарная томография), — это сделало МРТ практичной. Первый сканер всего тела он испытал на себе."}}}, {"n": 18, "options": [{"name": {"en": "Mother Teresa", "kk": "Тереза ана", "ru": "Мать Тереза"}, "cat": "Peace", "year": 1979, "topic": {"en": "work for the poorest of the poor in Calcutta", "kk": "Калькуттадағы ең кедейлерге көмек", "ru": "помощь беднейшим в Калькутте"}}, {"name": {"en": "Emmanuelle Charpentier", "kk": "Эмманюэль Шарпантье", "ru": "Эмманюэль Шарпантье"}, "cat": "Chemistry", "year": 2020, "topic": {"en": "CRISPR-Cas9 genome editing", "kk": "CRISPR-Cas9 арқылы геномды өңдеу", "ru": "редактирование генома CRISPR-Cas9"}}, {"name": {"en": "Eric Betzig", "kk": "Эрик Бетциг", "ru": "Эрик Бетциг"}, "cat": "Chemistry", "year": 2014, "topic": {"en": "super-resolved fluorescence microscopy (PALM)", "kk": "аса жоғары ажыратымдылықтағы флуоресцентті микроскопия (PALM)", "ru": "флуоресцентная микроскопия сверхвысокого разрешения (PALM)"}}], "answer": 2, "physicist": {"name": {"en": "Eric Betzig", "kk": "Эрик Бетциг", "ru": "Эрик Бетциг"}, "cat": "Chemistry", "year": 2014, "topic": {"en": "super-resolved fluorescence microscopy (PALM)", "kk": "аса жоғары ажыратымдылықтағы флуоресцентті микроскопия (PALM)", "ru": "флуоресцентная микроскопия сверхвысокого разрешения (PALM)"}, "bg": {"en": "BS in physics at Caltech (1983), MS and PhD in applied and engineering physics at Cornell (1985, 1988). Worked at Bell Labs, then joined the Janelia Research Campus in 2006. Now professor of physics and of molecular and cell biology at Berkeley.", "kk": "Калтехте физика бакалавры (1983), Корнеллде қолданбалы және инженерлік физика бойынша магистр мен докторлық (1985, 1988). Bell Labs-та жұмыс істеді, 2006 жылы Джанелия зерттеу кампусына келді. Қазір Берклиде физика және молекулалық-жасушалық биология профессоры.", "ru": "Бакалавр физики в Калтехе (1983), магистр и докторская по прикладной и инженерной физике в Корнелле (1985, 1988). Работал в Bell Labs, в 2006 году пришёл в исследовательский кампус Джанелия. Ныне профессор физики и молекулярной и клеточной биологии в Беркли."}, "helped": {"en": "With his old Bell Labs colleague Harald Hess he built the first PALM microscope in Hess's living room: switching on only a few fluorescent molecules at a time and locating each one precisely, they imaged proteins at nanometre resolution. Published in 2006, it won the Nobel eight years later.", "kk": "Bell Labs-тағы ескі әріптесі Харальд Хесспен бірге ол алғашқы PALM микроскопын Хесстің қонақ бөлмесінде құрастырды: бір мезгілде тек бірнеше флуоресцентті молекуланы қосып, әрқайсысының орнын дәл анықтап, олар ақуыздардың нанометрлік ажыратымдылықтағы кескінін алды. 2006 жылы жарияланған жұмыс сегіз жылдан кейін Нобель сыйлығын әкелді.", "ru": "Со старым коллегой по Bell Labs Харальдом Хессом он собрал первый микроскоп PALM в гостиной Хесса: включая лишь несколько флуоресцентных молекул за раз и точно определяя положение каждой, они получили изображения белков с нанометровым разрешением. Работа вышла в 2006 году, а через восемь лет принесла Нобелевскую премию."}}}, {"n": 19, "options": [{"name": {"en": "Daniel Kahneman", "kk": "Даниэль Канеман", "ru": "Даниэль Канеман"}, "cat": "Economics", "year": 2002, "topic": {"en": "psychology of judgement under uncertainty", "kk": "белгісіздік жағдайындағы пайымдау психологиясы", "ru": "психология суждений в условиях неопределённости"}}, {"name": {"en": "Jan Tinbergen", "kk": "Ян Тинберген", "ru": "Ян Тинберген"}, "cat": "Economics", "year": 1969, "topic": {"en": "dynamic models for the analysis of economic processes (first Economics prize)", "kk": "экономикалық процестерді талдауға арналған динамикалық модельдер (экономика бойынша алғашқы сыйлық)", "ru": "динамические модели для анализа экономических процессов (первая премия по экономике)"}}, {"name": {"en": "Hermann Hesse", "kk": "Герман Гессе", "ru": "Герман Гессе"}, "cat": "Literature", "year": 1946, "topic": {"en": "'Siddhartha', 'Steppenwolf'", "kk": "«Сиддхартха», «Дала қасқыры»", "ru": "«Сиддхартха», «Степной волк»"}}], "answer": 1, "physicist": {"name": {"en": "Jan Tinbergen", "kk": "Ян Тинберген", "ru": "Ян Тинберген"}, "cat": "Economics", "year": 1969, "topic": {"en": "dynamic models for the analysis of economic processes (first Economics prize)", "kk": "экономикалық процестерді талдауға арналған динамикалық модельдер (экономика бойынша алғашқы сыйлық)", "ru": "динамические модели для анализа экономических процессов (первая премия по экономике)"}, "bg": {"en": "PhD in physics at Leiden (1929) under Paul Ehrenfest. His thesis was titled 'Minimum problems in physics and economics'. His brother Nikolaas won the Medicine prize in 1973.", "kk": "Лейденде Пауль Эренфесттің жетекшілігімен физика бойынша докторлық (1929). Диссертациясының атауы — «Физика мен экономикадағы минимум есептері». Інісі Николас 1973 жылы медицина сыйлығын алды.", "ru": "Докторская по физике в Лейдене (1929) под руководством Пауля Эренфеста. Диссертация называлась «Задачи на минимум в физике и экономике». Его брат Николас получил премию по медицине в 1973 году."}, "helped": {"en": "He carried differential equations and statistical methods from physics into economics and built the first macroeconometric model of a whole national economy (Netherlands 1936, USA 1939). The Tinbergen rule says you need one policy instrument for each policy target.", "kk": "Ол дифференциалдық теңдеулер мен статистикалық әдістерді физикадан экономикаға көшіріп, тұтас ұлттық экономиканың алғашқы макроэконометрикалық моделін құрды (Нидерланды, 1936; АҚШ, 1939). Тинберген ережесі: саясаттың әр мақсатына жеке құрал қажет.", "ru": "Он перенёс дифференциальные уравнения и статистические методы из физики в экономику и построил первую макроэконометрическую модель целой национальной экономики (Нидерланды, 1936; США, 1939). Правило Тинбергена: на каждую цель политики нужен свой инструмент."}}}, {"n": 20, "options": [{"name": {"en": "Dorothy Hodgkin", "kk": "Дороти Ходжкин", "ru": "Дороти Ходжкин"}, "cat": "Chemistry", "year": 1964, "topic": {"en": "X-ray structures of vitamin B12 and penicillin", "kk": "B12 витамині мен пенициллиннің рентгендік құрылымдары", "ru": "рентгеновские структуры витамина B12 и пенициллина"}}, {"name": {"en": "Rosalyn Yalow", "kk": "Розалин Ялоу", "ru": "Розалин Ялоу"}, "cat": "Medicine", "year": 1977, "topic": {"en": "development of radioimmunoassay for peptide hormones", "kk": "пептидті гормондардың радиоиммундық талдауын жасау", "ru": "разработка радиоиммунного анализа пептидных гормонов"}}, {"name": {"en": "Rabindranath Tagore", "kk": "Рабиндранат Тагор", "ru": "Рабиндранат Тагор"}, "cat": "Literature", "year": 1913, "topic": {"en": "'Gitanjali'; first non-European laureate", "kk": "«Гитанджали»; алғашқы еуропалық емес лауреат", "ru": "«Гитанджали»; первый неевропейский лауреат"}}], "answer": 1, "physicist": {"name": {"en": "Rosalyn Yalow", "kk": "Розалин Ялоу", "ru": "Розалин Ялоу"}, "cat": "Medicine", "year": 1977, "topic": {"en": "development of radioimmunoassay for peptide hormones", "kk": "пептидті гормондардың радиоиммундық талдауын жасау", "ru": "разработка радиоиммунного анализа пептидных гормонов"}, "bg": {"en": "PhD in nuclear physics at the University of Illinois (1945), the only woman among 400 faculty and students in the department. Set up the radioisotope service at the Bronx VA hospital.", "kk": "Иллинойс университетінде ядролық физика бойынша докторлық (1945) — факультеттегі 400 оқытушы мен студенттің арасындағы жалғыз әйел. Бронкстағы ардагерлер госпиталінде радиоизотоп қызметін құрды.", "ru": "Докторская по ядерной физике в Университете Иллинойса (1945) — единственная женщина среди 400 преподавателей и студентов факультета. Создала радиоизотопную службу в госпитале ветеранов в Бронксе."}, "helped": {"en": "With Solomon Berson she labelled insulin with radioactive iodine and used gamma counting to detect hormones at picogram concentrations, a million times more sensitive than earlier methods. The second woman to win the Medicine prize.", "kk": "Соломон Берсонмен бірге ол инсулинді радиоактивті йодпен таңбалап, гамма-санау арқылы гормондарды пикограмм концентрацияда — бұрынғы әдістерден миллион есе сезімтал — анықтады. Медицина сыйлығын алған екінші әйел.", "ru": "Вместе с Соломоном Берсоном она пометила инсулин радиоактивным иодом и с помощью счёта гамма-квантов научилась определять гормоны в пикограммовых концентрациях — в миллион раз чувствительнее прежних методов. Вторая женщина, получившая премию по медицине."}}}, {"n": 21, "options": [{"name": {"en": "Erwin Neher", "kk": "Эрвин Неэр", "ru": "Эрвин Неэр"}, "cat": "Medicine", "year": 1991, "topic": {"en": "function of single ion channels in cells (patch clamp)", "kk": "жасушалардағы жеке ион арналарының қызметі (пэтч-кламп)", "ru": "работа одиночных ионных каналов в клетках (пэтч-кламп)"}}, {"name": {"en": "Amartya Sen", "kk": "Амартия Сен", "ru": "Амартия Сен"}, "cat": "Economics", "year": 1998, "topic": {"en": "welfare economics, famine and poverty", "kk": "әл-ауқат экономикасы, аштық пен кедейлік", "ru": "экономика благосостояния, голод и бедность"}}, {"name": {"en": "Harold Kroto", "kk": "Гарольд Крото", "ru": "Гарольд Крото"}, "cat": "Chemistry", "year": 1996, "topic": {"en": "discovery of fullerenes (C60 'buckyballs')", "kk": "фуллерендердің ашылуы (C60, «бакиболдар»)", "ru": "открытие фуллеренов (C60, «бакиболы»)"}}], "answer": 0, "physicist": {"name": {"en": "Erwin Neher", "kk": "Эрвин Неэр", "ru": "Эрвин Неэр"}, "cat": "Medicine", "year": 1991, "topic": {"en": "function of single ion channels in cells (patch clamp)", "kk": "жасушалардағы жеке ион арналарының қызметі (пэтч-кламп)", "ru": "работа одиночных ионных каналов в клетках (пэтч-кламп)"}, "bg": {"en": "Studied physics at the Technical University of Munich (1963-66), took a master's in biophysics at Wisconsin and a PhD in Munich (1970) at the Max Planck Institute for Psychiatry. From 1983 director at the Max Planck Institute for Biophysical Chemistry in Göttingen.", "kk": "Мюнхен техникалық университетінде физиканы оқыды (1963–66), Висконсинде биофизика магистрі, Мюнхенде Макс Планк қоғамының Психиатрия институтында докторлық (1970) алды. 1983 жылдан Гёттингендегі Биофизикалық химия институтының директоры.", "ru": "Изучал физику в Мюнхенском техническом университете (1963–66), получил магистра по биофизике в Висконсине и докторскую в Мюнхене (1970) в Институте психиатрии Общества Макса Планка. С 1983 года директор Института биофизической химии в Гёттингене."}, "helped": {"en": "Measuring the picoampere current through one ion channel needed a gigaohm seal and ultra-low-noise electronics. Neher's grasp of noise theory and circuit design made the patch-clamp technique possible, and it became the standard tool of neuroscience.", "kk": "Бір ион арнасы арқылы өтетін пикоамперлік токты өлшеу үшін гигаомдық тығыздау және аса аз шуылды электроника қажет болды. Неэрдің шуыл теориясы мен схема жобалауды білуі пэтч-кламп әдісін мүмкін етті, ол нейроғылымның стандартты құралына айналды.", "ru": "Чтобы измерить пикоамперный ток через один ионный канал, нужны гигаомный контакт и сверхмалошумящая электроника. Знание теории шумов и схемотехники позволило Неэру создать метод пэтч-кламп, ставший стандартным инструментом нейронауки."}}}, {"n": 22, "options": [{"name": {"en": "Walter Gilbert", "kk": "Уолтер Гилберт", "ru": "Уолтер Гилберт"}, "cat": "Chemistry", "year": 1980, "topic": {"en": "determination of base sequences in DNA", "kk": "ДНҚ-дағы негіздердің реттілігін анықтау", "ru": "определение последовательности оснований в ДНК"}}, {"name": {"en": "Ivan Pavlov", "kk": "Иван Павлов", "ru": "Иван Павлов"}, "cat": "Medicine", "year": 1904, "topic": {"en": "physiology of digestion", "kk": "ас қорыту физиологиясы", "ru": "физиология пищеварения"}}, {"name": {"en": "Malala Yousafzai", "kk": "Малала Юсуфзай", "ru": "Малала Юсуфзай"}, "cat": "Peace", "year": 2014, "topic": {"en": "right of all children to education; youngest laureate", "kk": "барлық балалардың білім алу құқығы; ең жас лауреат", "ru": "право всех детей на образование; самый молодой лауреат"}}], "answer": 0, "physicist": {"name": {"en": "Walter Gilbert", "kk": "Уолтер Гилберт", "ru": "Уолтер Гилберт"}, "cat": "Chemistry", "year": 1980, "topic": {"en": "determination of base sequences in DNA", "kk": "ДНҚ-дағы негіздердің реттілігін анықтау", "ru": "определение последовательности оснований в ДНК"}, "bg": {"en": "Bachelor's in chemistry and physics (1953) and master's in physics (1954) at Harvard, then a PhD in physics at Cambridge (1957) under Abdus Salam. Assistant professor of physics at Harvard from 1959.", "kk": "Гарвардта химия және физика б
