<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Физика — олимпиадаға дайындық</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b3a5c'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffd166'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='9' fill='none' stroke='%23ffd166' stroke-width='2.5' transform='rotate(-30 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='9' fill='none' stroke='%23ffd166' stroke-width='2.5' transform='rotate(30 32 32)'/%3E%3C/svg%3E">
<style>
  :root { --ink:#1b2430; --muted:#5f6b7a; --line:#e3e7ec; --accent:#1b3a5c; --gold:#ffd166; --bg:#f7f8fa; }
  * { box-sizing:border-box }
  body { margin:0; font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg) }
  header { background:var(--accent); color:#fff; padding:40px 20px 34px }
  .wrap { max-width:760px; margin:0 auto }
  h1 { margin:0 0 6px; font-size:2rem; line-height:1.2 }
  header p { margin:0; color:#cfd8e3 }
  main { padding:28px 20px 60px }
  ol { list-style:none; padding:0; margin:0; counter-reset:n }
  li { counter-increment:n }
  li a { display:grid; grid-template-columns:2.2em 1fr; gap:6px 12px; align-items:baseline; padding:16px 18px; margin-bottom:12px;
          background:#fff; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:transform .12s, box-shadow .12s }
  li a::before { content:counter(n); grid-row:1 / span 2; font-weight:700; color:var(--accent); font-size:1.15rem }
  li a:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(27,58,92,.10) }
  .t { font-weight:600 }
  .d { grid-column:2; color:var(--muted); font-size:.93rem }
  .empty { color:var(--muted); padding:16px 18px }
  footer { color:var(--muted); font-size:.85rem; text-align:center; padding:0 20px 40px }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Физика</h1>
  <p>Олимпиадаға дайындық сабақтары · 8-сынып</p>
</div></header>
<main><div class="wrap">
    <ol>
      <li class="empty">Сабақтар әзірше қосылмаған.</li>
    </ol>
</div></main>
<footer>Бекдәулет Шүкірғалиев · жеке оқу беті</footer>
</body>
</html>
